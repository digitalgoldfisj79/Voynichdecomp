name: LAAFU ordinal-position v0.1

on:
  push:
    branches:
      - experiment/laafu-ordinal-position-v0.1-20260821
    paths:
      - 'experiments/laafu_ordinal_v01/**'
      - '.github/workflows/laafu_ordinal_v01.yml'
      - 'voynich_section_map.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy scipy scikit-learn
      - name: Acquire primary ZL3b source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _source
          curl --fail --location --retry 5 --retry-delay 2 \
            https://www.voynich.nu/data/ZL3b-n.txt \
            -o _source/ZL3b-n.txt
          head -n 4 _source/ZL3b-n.txt
          sha256sum _source/ZL3b-n.txt
      - name: Execute preregistered test
        run: |
          python experiments/laafu_ordinal_v01/run_laafu_ordinal_v01.py \
            --source _source/ZL3b-n.txt \
            --section-map voynich_section_map.json \
            --outdir results/laafu_ordinal_v01 \
            --null-reps 30
      - name: Surface result summary
        if: always()
        shell: bash
        run: |
          if [ -f results/laafu_ordinal_v01/RESULTS.md ]; then
            cat results/laafu_ordinal_v01/RESULTS.md
          fi
      - name: Upload complete audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laafu-ordinal-v01-results
          path: results/laafu_ordinal_v01/
          if-no-files-found: error
          retention-days: 30
