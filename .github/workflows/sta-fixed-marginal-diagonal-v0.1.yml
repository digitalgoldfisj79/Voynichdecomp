name: STA fixed-marginal diagonal v0.1

on:
  push:
    branches:
      - experiment/sta-fixed-marginal-diagonal-v0.1-20260815
    paths:
      - 'experiments/sta_fixed_marginal_diagonal_v0_1/**'
      - '.github/workflows/sta-fixed-marginal-diagonal-v0.1.yml'

permissions:
  contents: write

jobs:
  fixed-marginal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install 'numpy<2'
      - name: Compile frozen executable
        run: python -m py_compile experiments/sta_fixed_marginal_diagonal_v0_1/run_fixed_marginal_v0_1.py experiments/sta_fixed_marginal_diagonal_v0_1/run_build_checks.py
      - name: Run target-blind exactness checks
        run: python experiments/sta_fixed_marginal_diagonal_v0_1/run_build_checks.py
      - name: Acquire canonical RF1b STA source
        if: hashFiles('experiments/sta_fixed_marginal_diagonal_v0_1/EXECUTE_FULL_20260815.txt') != ''
        run: |
          curl --fail --location --retry 3 --output /tmp/RF1b.txt https://voynich.nu/data/sta/RF1b.txt
          echo '81c331b7d8e76761e27d350c3b37ccfbe192848e6c8a227bcb5d40fb29259b17  /tmp/RF1b.txt' | sha256sum --check --strict
      - name: Run frozen full fixed-marginal test
        if: hashFiles('experiments/sta_fixed_marginal_diagonal_v0_1/EXECUTE_FULL_20260815.txt') != ''
        run: python experiments/sta_fixed_marginal_diagonal_v0_1/run_fixed_marginal_v0_1.py /tmp/RF1b.txt
      - name: Commit deterministic results
        if: hashFiles('experiments/sta_fixed_marginal_diagonal_v0_1/EXECUTE_FULL_20260815.txt') != ''
        run: |
          git config user.name 'voynich-fixed-marginal-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add results/sta_fixed_marginal_diagonal_v0_1/
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'Add STA fixed-marginal diagonal results'
            git pull --rebase origin experiment/sta-fixed-marginal-diagonal-v0.1-20260815
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('experiments/sta_fixed_marginal_diagonal_v0_1/EXECUTE_FULL_20260815.txt') != ''
        with:
          name: sta-fixed-marginal-diagonal-v0.1-results
          path: results/sta_fixed_marginal_diagonal_v0_1/
