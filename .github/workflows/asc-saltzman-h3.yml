name: ASC Saltzman H3

on:
  push:
    branches:
      - experiment/saltzman-state-h3-20260814
    paths:
      - .github/workflows/asc-saltzman-h3.yml

permissions:
  contents: read

jobs:
  h3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frozen payload parts
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet numpy
      - name: Restore frozen H3 payload
        shell: bash
        run: |
          mkdir -p /tmp/saltzman_h3
          cat saltzman_h3/h3part00.txt saltzman_h3/h3part01.txt saltzman_h3/h3part02.txt saltzman_h3/h3part03.txt saltzman_h3/h3part04.txt > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.zip
          cd /tmp/saltzman_h3
          unzip -q /tmp/payload.zip
          mkdir -p results inputs
          echo 'Frozen payload SHA:'
          sha256sum /tmp/payload.zip
      - name: Build canonical ReM lineation
        working-directory: /tmp/saltzman_h3
        run: python build_rem_lineation.py --work /tmp/rem_lineation_build | tee H3_LINEATION_BUILD.log
      - name: Run frozen H3
        working-directory: /tmp/saltzman_h3
        run: python run_h3_line_end.py | tee H3_RUN.log
      - name: Build result manifest
        if: always()
        working-directory: /tmp/saltzman_h3
        run: |
          find inputs results -maxdepth 1 -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum > H3_RESULT_MANIFEST.sha256
      - name: Upload H3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asc-saltzman-h3-20260814
          path: |
            /tmp/saltzman_h3/results/
            /tmp/saltzman_h3/inputs/rem_lineation.json.xz
            /tmp/saltzman_h3/inputs/rem_lineation_qc.json
            /tmp/saltzman_h3/H3_RESULT_MANIFEST.sha256
            /tmp/saltzman_h3/H3_LINEATION_BUILD.log
            /tmp/saltzman_h3/H3_RUN.log
          if-no-files-found: warn
          retention-days: 7
