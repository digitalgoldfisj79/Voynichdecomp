name: Meaningful generative comparanda v0.1
on:
  push:
    branches:
      - experiment/meaningful-generative-comparanda-v0.1-20260813
  workflow_dispatch:
jobs:
  llct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LLCT analysis dependency
        run: python -m pip install 'numpy<2'
      - name: Fetch frozen LLCT1 v1.2
        run: |
          mkdir -p external results
          curl -L --fail --retry 3 'https://zenodo.org/records/3633607/files/LLCT1%2C%20version%201.2.xml?download=1' -o external/LLCT1_v1_2.xml
          echo 'ec45ae3a6844fad40a00d2e8050cfc74  external/LLCT1_v1_2.xml' | md5sum -c -
      - name: Run LLCT formulaic/free panel
        run: |
          set -o pipefail
          python experiments/meaningful_generative_comparanda_v0_1/run_llct_formulaic_profile.py external/LLCT1_v1_2.xml --out results/RESULTS_llct_formulaic_profile_v0_1.json | tee results/LLCT_RUN.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meaningful-generative-llct-results
          path: results/
  cantus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact parser dependencies
        run: |
          python -m pip install 'numpy<2' 'Arpeggio>=1.9.2'
      - name: Fetch pinned chant21 parser and frozen CantusCorpus v0.2
        run: |
          mkdir -p external/chant21_parser external/cantus results
          curl -L --fail 'https://raw.githubusercontent.com/bacor/chant21/ad52f6084efce4a440d083b588d7b51ff6973730/chant21/cantus/parser_volpiano.py' -o external/chant21_parser/parser_volpiano.py
          curl -L --fail 'https://raw.githubusercontent.com/bacor/chant21/ad52f6084efce4a440d083b588d7b51ff6973730/chant21/cantus/cantus_volpiano.peg' -o external/chant21_parser/cantus_volpiano.peg
          echo 'b4e3dda7555f4f1362d04f8dea0ab6e0dbfa1402  external/chant21_parser/parser_volpiano.py' | sha1sum -c -
          echo '33e260a0958ac6c5c1d6deb955472877b3cf0cc2  external/chant21_parser/cantus_volpiano.peg' | sha1sum -c -
          curl -L --fail --retry 3 'https://github.com/bacor/cantuscorpus/releases/download/v0.2/cantuscorpus-v0.2.zip' -o external/cantuscorpus-v0.2.zip
          unzip -q external/cantuscorpus-v0.2.zip -d external/cantus
      - name: Run chant boundary-formulaicity panel
        run: |
          set -o pipefail
          python experiments/meaningful_generative_comparanda_v0_1/run_cantus_boundary_formulaicity.py external/cantus --parser-dir external/chant21_parser --out results/RESULTS_cantus_boundary_formulaicity_v0_1.json | tee results/CANTUS_RUN.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meaningful-generative-cantus-results
          path: results/
