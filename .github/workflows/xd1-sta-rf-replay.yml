name: XD1 STA RF representation replay
on:
  push:
    branches: [supergrammar-xd1-closeout-20260928]
    paths: [".github/workflows/xd1-sta-rf-replay.yml"]
permissions:
  contents: read
jobs:
  sta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy
      - run: python research/xd1_sta_rf_repetition_20260928.py --preflight
      - run: python research/xd1_sta_rf_repetition_20260928.py --run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xd1-sta-rf-replay
          path: research/xd1_sta_rf_results_20260928/
          if-no-files-found: warn
