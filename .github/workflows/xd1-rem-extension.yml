name: XD1 ReM extension (manual legacy)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rem:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: ReM source-only preflight
        run: python research/xd1_rem_repetition_20260928.py --preflight
      - name: Frozen ReM metric run
        run: python research/xd1_rem_repetition_20260928.py --run
