name: JLCD Exact Near-Neighbour Bound
on:
  workflow_dispatch:
  push:
    branches: [experiment/joachim-length-v01-20260829]
    paths:
      - experiments/joachim_length_v01/run_jlcd_neighbour_bound.py
      - .github/workflows/jlcd_neighbour_bound.yml
permissions:
  contents: read
jobs:
  bound:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Acquire sources
        run: |
          mkdir -p experiments/joachim_length_v01/_bound_source
          curl --fail --location --retry 5 https://www.voynich.nu/data/ZL3b-n.txt -o experiments/joachim_length_v01/_bound_source/ZL3b-n.txt
          curl --fail --location --retry 5 https://raw.githubusercontent.com/digitalgoldfisj79/Voynichdecomp/experiment/terminal-cipher-programme-v0.6-20260716/voynich_section_map.json -o experiments/joachim_length_v01/_bound_source/voynich_section_map.json
          sha256sum experiments/joachim_length_v01/_bound_source/* | tee experiments/joachim_length_v01/_bound_source/SHA256SUMS.txt
      - name: Run exact near-neighbour bound
        run: |
          mkdir -p experiments/joachim_length_v01/neighbour_bound_output
          python experiments/joachim_length_v01/run_jlcd_neighbour_bound.py --source experiments/joachim_length_v01/_bound_source/ZL3b-n.txt --section-map experiments/joachim_length_v01/_bound_source/voynich_section_map.json --out experiments/joachim_length_v01/neighbour_bound_output | tee experiments/joachim_length_v01/neighbour_bound_console.txt
      - name: Verify
        run: |
          test -s experiments/joachim_length_v01/neighbour_bound_output/NEIGHBOUR_BOUND.md
          test -s experiments/joachim_length_v01/neighbour_bound_output/NEIGHBOUR_BOUND.json
          cat experiments/joachim_length_v01/neighbour_bound_output/NEIGHBOUR_BOUND.md
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jlcd-neighbour-bound-results
          path: |
            experiments/joachim_length_v01/neighbour_bound_output/
            experiments/joachim_length_v01/neighbour_bound_console.txt
            experiments/joachim_length_v01/_bound_source/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
