name: SVT v0.2 Gate A

on:
  pull_request:
    paths:
      - 'experiments/stateful_verbose_transducer_v0_1/SVT_V0_2_PROTOCOL.md'
      - 'experiments/stateful_verbose_transducer_v0_1/svt_v02.py'
      - 'experiments/stateful_verbose_transducer_v0_1/run_v02_gate_a.py'
      - '.github/workflows/svt-v02-gate-a.yml'
  workflow_dispatch:

jobs:
  gate-a:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install --upgrade pip numpy numba rapidfuzz
      - name: Compile
        run: |
          python -m py_compile \
            experiments/stateful_verbose_transducer_v0_1/svt_v01.py \
            experiments/stateful_verbose_transducer_v0_1/svt_v02.py \
            experiments/stateful_verbose_transducer_v0_1/run_v02_gate_a.py
      - name: Run binding fresh-synthetic Gate A
        run: |
          python experiments/stateful_verbose_transducer_v0_1/run_v02_gate_a.py \
            --repo . \
            --output results/svt_v02_gate_a_de_192.json \
            --iso de --length 192 --replicates 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: svt-v02-gate-a
          path: results/svt_v02_gate_a_de_192.json
          if-no-files-found: ignore
