name: Sobel quarter checkpoint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sobel-quarter-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: python -m pip install --disable-pip-version-check requests pillow numpy opencv-python-headless
      - name: Merge completed quarter artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import csv, io, json, os, re, zipfile
          from pathlib import Path
          import requests
          from PIL import Image, ImageDraw
          REPO='digitalgoldfisj79/Voynichdecomp'; RUN=32341056376
          sess=requests.Session(); h={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          arts=[]; page=1
          while True:
              r=sess.get(f'https://api.github.com/repos/{REPO}/actions/runs/{RUN}/artifacts?per_page=100&page={page}',headers=h,timeout=30); r.raise_for_status(); b=r.json().get('artifacts',[]); arts.extend(b)
              if len(b)<100: break
              page+=1
          pat=re.compile(r'^sobel-full-s(\d+)-c(\d+)$'); sel=[]
          for a in arts:
              m=pat.match(a.get('name',''))
              if m and not a.get('expired'):
                  s,c=map(int,m.groups())
                  if s<=7 or (s==8 and c==0): sel.append((s,c,a))
          sel.sort(); rows=[]; sums=[]; loaded=[]; failures=[]
          for s,c,a in sel:
              try:
                  z=sess.get(a['archive_download_url'],headers=h,timeout=60); z.raise_for_status()
                  with zipfile.ZipFile(io.BytesIO(z.content)) as zz:
                      d=json.loads(zz.read(next(n for n in zz.namelist() if n.endswith('.json'))))
                  sums.append(d.get('summary',{})); rows.extend(d.get('results',[])); loaded.append(f's{s}c{c}')
              except Exception as e: failures.append({'shard':s,'chunk':c,'artifact_id':a['id'],'error':repr(e)})
          rows.sort(key=lambda x:x.get('score',1e99)); seen=sum(int(x.get('seen',0) or 0) for x in sums); ok=sum(int(x.get('ok',0) or 0) for x in sums); errs=sum(int(x.get('errors',0) or 0) for x in sums)
          out={'version':'sobel-quarter-checkpoint-v0.4','source_run':RUN,'scope':'shards 0-7 plus shard 8 chunk 0','artifacts_loaded':len(loaded),'loaded_chunks':loaded,'artifact_failures':failures,'pages_seen':seen,'pages_ok':ok,'page_errors':errs,'candidate_rows_merged':len(rows),'results':rows[:500]}
          Path('sobel_quarter_checkpoint.json').write_text(json.dumps(out,indent=2))
          with open('sobel_quarter_top100.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['rank','score','manuscript_id','folio_label','canvas_index','region_url','search_url','work_id','x','y','w','h','rotation_deg','base_width'])
              for i,r in enumerate(rows[:100],1): w.writerow([i,r.get('score'),r.get('manuscript_id'),r.get('folio_label'),r.get('canvas_index'),r.get('region_url'),r.get('search_url'),r.get('work_id'),r.get('x'),r.get('y'),r.get('w'),r.get('h'),r.get('rotation_deg'),r.get('base_width')])
          def img(r):
              for u in [r.get('region_url'),r.get('search_url')]:
                  if not u: continue
                  try:
                      q=sess.get(u,headers={'User-Agent':'ManuComp-quarter-checkpoint/0.4'},timeout=20); q.raise_for_status(); im=Image.open(io.BytesIO(q.content)).convert('RGB')
                      if u==r.get('search_url'):
                          pw=float(r.get('page_w') or im.width); sc=im.width/pw; x=int(float(r.get('x',0))*sc); y=int(float(r.get('y',0))*sc); ww=int(float(r.get('w',im.width))*sc); hh=int(float(r.get('h',im.height))*sc); im=im.crop((max(0,x),max(0,y),min(im.width,x+ww),min(im.height,y+hh)))
                      return im
                  except Exception: pass
              return None
          tw,th,cols=320,280,4; sheet=Image.new('RGB',(cols*tw,5*th),'white'); dr=ImageDraw.Draw(sheet)
          for i,r in enumerate(rows[:20]):
              ox=(i%cols)*tw; oy=(i//cols)*th; im=img(r)
              if im: im.thumbnail((tw-20,th-65),Image.Resampling.LANCZOS); sheet.paste(im,(ox+(tw-im.width)//2,oy+5))
              else: dr.rectangle((ox+10,oy+10,ox+tw-10,oy+th-70),outline='gray'); dr.text((ox+20,oy+40),'image unavailable',fill='black')
              dr.text((ox+8,oy+th-58),f"#{i+1} raw {float(r.get('score',0)):.4f}\n{r.get('manuscript_id','')}\n{r.get('folio_label') or r.get('canvas_index','')}",fill='black')
          sheet.save('sobel_quarter_contact_sheet.jpg',quality=90)
          with open('sobel_quarter_summary.md','w') as f:
              f.write('# Sobel quarter checkpoint\n\n'); f.write(f'Loaded **{len(loaded)}** artifacts. Pages seen **{seen:,}**; successful **{ok:,}**; errors **{errs:,}**.\n\n'); f.write('| rank | score | manuscript | folio | region |\n|---:|---:|---|---|---|\n')
              for i,r in enumerate(rows[:25],1): f.write(f"| {i} | {float(r.get('score',0)):.5f} | `{r.get('manuscript_id','')}` | {r.get('folio_label') or r.get('canvas_index','')} | {r.get('region_url') or ''} |\n")
          print(json.dumps({'loaded':len(loaded),'failures':len(failures),'seen':seen,'ok':ok,'errors':errs,'candidates':len(rows),'best':rows[0].get('score') if rows else None}),flush=True)
          PY
          cat sobel_quarter_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Classical rerank top 500
        run: |
          python - <<'PY'
          import base64, csv, io, json, math
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import cv2, numpy as np, requests
          from PIL import Image, ImageDraw

          W,H=192,144
          raw=json.load(open('sobel_quarter_checkpoint.json')); candidates=raw['results'][:500]
          qraw=base64.b64decode(Path('experiments/sobel_shape_search/query_mask.b64').read_text().strip())
          q0=np.array(Image.open(io.BytesIO(qraw)).convert('L'))
          ys,xs=np.where(q0>127); q0=q0[ys.min():ys.max()+1,xs.min():xs.max()+1]

          def norm_query(angle):
              m=(q0>127).astype(np.uint8)*255
              pad=max(m.shape)//3+4; m=cv2.copyMakeBorder(m,pad,pad,pad,pad,cv2.BORDER_CONSTANT,value=0)
              ctr=(m.shape[1]/2,m.shape[0]/2); M=cv2.getRotationMatrix2D(ctr,float(angle or 0),1.0)
              m=cv2.warpAffine(m,M,(m.shape[1],m.shape[0]),flags=cv2.INTER_NEAREST,borderValue=0)
              yy,xx=np.where(m>0)
              if len(xx): m=m[yy.min():yy.max()+1,xx.min():xx.max()+1]
              return cv2.resize(m,(W,H),interpolation=cv2.INTER_NEAREST)

          def edge(gray, binary=False):
              g=cv2.resize(gray,(W,H),interpolation=cv2.INTER_AREA)
              if not binary: g=cv2.GaussianBlur(g,(3,3),0)
              return cv2.Canny(g,20 if binary else 45,80 if binary else 140)

          def hog(gray):
              g=cv2.resize(gray,(W,H),interpolation=cv2.INTER_AREA).astype(np.float32)
              gx=cv2.Sobel(g,cv2.CV_32F,1,0,ksize=3); gy=cv2.Sobel(g,cv2.CV_32F,0,1,ksize=3)
              mag=cv2.magnitude(gx,gy); ang=(cv2.phase(gx,gy,angleInDegrees=True)%180.0)
              feats=[]; cy,cx=H//4,W//4
              for iy in range(4):
                  for ix in range(4):
                      mm=mag[iy*cy:(iy+1)*cy,ix*cx:(ix+1)*cx].ravel(); aa=ang[iy*cy:(iy+1)*cy,ix*cx:(ix+1)*cx].ravel()
                      hist=np.zeros(9,np.float32); bins=np.minimum((aa/20).astype(int),8)
                      for b,v in zip(bins,mm): hist[b]+=v
                      n=np.linalg.norm(hist); feats.extend((hist/(n+1e-6)).tolist())
              v=np.asarray(feats,np.float32); return v/(np.linalg.norm(v)+1e-6)

          def cosine(a,b): return float(np.dot(a,b)/(max(np.linalg.norm(a)*np.linalg.norm(b),1e-9)))
          def sym_chamfer(qe,ce):
              q=(qe>0).astype(np.uint8); c=(ce>0).astype(np.uint8)
              if q.sum()==0 or c.sum()==0: return 99.0
              dc=cv2.distanceTransform((1-c).astype(np.uint8),cv2.DIST_L2,3); dq=cv2.distanceTransform((1-q).astype(np.uint8),cv2.DIST_L2,3)
              return float((dc[q>0].mean()+dq[c>0].mean())/2.0/max(W,H))

          def fetch_crop(r):
              for u,is_region in [(r.get('region_url'),True),(r.get('search_url'),False)]:
                  if not u: continue
                  try:
                      rr=requests.get(u,headers={'User-Agent':'ManuComp-quarter-rerank/0.1'},timeout=25); rr.raise_for_status(); im=Image.open(io.BytesIO(rr.content)).convert('L'); a=np.array(im)
                      if not is_region:
                          pw=float(r.get('page_w') or a.shape[1]); sc=a.shape[1]/pw; x=int(float(r.get('x',0))*sc); y=int(float(r.get('y',0))*sc); ww=int(float(r.get('w',a.shape[1]))*sc); hh=int(float(r.get('h',a.shape[0]))*sc); a=a[max(0,y):min(a.shape[0],y+hh),max(0,x):min(a.shape[1],x+ww)]
                      if a.size: return a
                  except Exception: pass
              raise RuntimeError('candidate crop unavailable')

          def one(idx,r):
              a=fetch_crop(r); qm=norm_query(r.get('rotation_deg',0)); qe=edge(qm,True); ce=edge(a,False)
              qh=hog(255-qm); ch=hog(a)
              hcos=cosine(qh,ch); ecos=cosine((qe>0).astype(np.float32).ravel(),(ce>0).astype(np.float32).ravel())
              sch=sym_chamfer(qe,ce); dens=float((ce>0).sum()/max((qe>0).sum(),1))
              z=dict(r); z.update(raw_rank=idx+1,hog_cosine=hcos,edge_cosine=ecos,classical_cosine=0.8*hcos+0.2*ecos,symmetric_chamfer=sch,edge_density_ratio=dens)
              return z

          done=[]; failures=[]
          with ThreadPoolExecutor(max_workers=12) as ex:
              fs={ex.submit(one,i,r):(i,r) for i,r in enumerate(candidates)}
              for n,f in enumerate(as_completed(fs),1):
                  i,r=fs[f]
                  try: done.append(f.result())
                  except Exception as e: failures.append({'raw_rank':i+1,'work_id':r.get('work_id'),'error':repr(e)})
                  if n%50==0: print(json.dumps({'processed':n,'ok':len(done),'errors':len(failures)}),flush=True)

          N=max(len(done),1)
          byraw=sorted(done,key=lambda r:r['score']); bych=sorted(done,key=lambda r:r['symmetric_chamfer']); bycos=sorted(done,key=lambda r:r['classical_cosine'],reverse=True)
          rr={r['work_id']:i+1 for i,r in enumerate(byraw)}; cr={r['work_id']:i+1 for i,r in enumerate(bych)}; kr={r['work_id']:i+1 for i,r in enumerate(bycos)}
          for r in done:
              r['symmetric_chamfer_rank']=cr[r['work_id']]; r['classical_cosine_rank']=kr[r['work_id']]
              r['fusion_score']=0.2*rr[r['work_id']]/N+0.4*cr[r['work_id']]/N+0.4*kr[r['work_id']]/N
          fused=sorted(done,key=lambda r:r['fusion_score'])
          out={'version':'quarter-classical-rerank-v0.1','source_run':raw['source_run'],'source_pages_seen':raw['pages_seen'],'attempted':len(candidates),'ok':len(done),'errors':failures,'method':{'prefilter':'raw Sobel/chamfer top 500','rerank':'0.2 raw-rank + 0.4 symmetric-chamfer-rank + 0.4 HOG/edge-cosine-rank','models':'none'},'results':fused}
          Path('sobel_quarter_reranked.json').write_text(json.dumps(out,indent=2))
          with open('sobel_quarter_reranked_top100.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['rank','fusion_score','raw_rank','raw_score','symmetric_chamfer','classical_cosine','hog_cosine','edge_cosine','edge_density_ratio','manuscript_id','folio_label','work_id','region_url'])
              for i,r in enumerate(fused[:100],1): w.writerow([i,r['fusion_score'],r['raw_rank'],r['score'],r['symmetric_chamfer'],r['classical_cosine'],r['hog_cosine'],r['edge_cosine'],r['edge_density_ratio'],r.get('manuscript_id'),r.get('folio_label'),r.get('work_id'),r.get('region_url')])

          def get_display(r):
              try:
                  u=r.get('region_url') or r.get('search_url'); rr=requests.get(u,headers={'User-Agent':'ManuComp-quarter-rerank/0.1'},timeout=20); rr.raise_for_status(); return Image.open(io.BytesIO(rr.content)).convert('RGB')
              except Exception: return None
          tw,th,cols=340,300,4; sheet=Image.new('RGB',(cols*tw,5*th),'white'); dr=ImageDraw.Draw(sheet)
          for i,r in enumerate(fused[:20]):
              ox=(i%cols)*tw; oy=(i//cols)*th; im=get_display(r)
              if im: im.thumbnail((tw-20,th-85),Image.Resampling.LANCZOS); sheet.paste(im,(ox+(tw-im.width)//2,oy+5))
              else: dr.rectangle((ox+10,oy+10,ox+tw-10,oy+th-90),outline='gray')
              dr.text((ox+8,oy+th-80),f"#{i+1} fused {r['fusion_score']:.3f} raw#{r['raw_rank']}\nch {r['symmetric_chamfer']:.3f} cos {r['classical_cosine']:.3f}\n{r.get('manuscript_id','')} | {r.get('folio_label') or r.get('canvas_index','')}",fill='black')
          sheet.save('sobel_quarter_reranked_contact_sheet.jpg',quality=92)
          with open('sobel_quarter_reranked_summary.md','w') as f:
              f.write('# Quarter-corpus classical rerank\n\n'); f.write(f"Attempted {len(candidates)} raw candidates; valid reranks **{len(done)}**; fetch/process errors **{len(failures)}**. No learned model used.\n\n")
              f.write('| rank | fused | raw rank | chamfer | cosine | manuscript | folio |\n|---:|---:|---:|---:|---:|---|---|\n')
              for i,r in enumerate(fused[:25],1): f.write(f"| {i} | {r['fusion_score']:.4f} | {r['raw_rank']} | {r['symmetric_chamfer']:.4f} | {r['classical_cosine']:.4f} | `{r.get('manuscript_id','')}` | {r.get('folio_label') or r.get('canvas_index','')} |\n")
          print(json.dumps({'event':'rerank_done','ok':len(done),'errors':len(failures),'best':[{k:r.get(k) for k in ['manuscript_id','folio_label','fusion_score','raw_rank','symmetric_chamfer','classical_cosine']} for r in fused[:5]]}),flush=True)
          PY
          cat sobel_quarter_reranked_summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sobel-quarter-checkpoint
          path: |
            sobel_quarter_checkpoint.json
            sobel_quarter_top100.csv
            sobel_quarter_summary.md
            sobel_quarter_contact_sheet.jpg
            sobel_quarter_reranked.json
            sobel_quarter_reranked_top100.csv
            sobel_quarter_reranked_summary.md
            sobel_quarter_reranked_contact_sheet.jpg
          retention-days: 14
