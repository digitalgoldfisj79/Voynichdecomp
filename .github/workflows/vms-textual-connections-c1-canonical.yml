name: VMS pure-text connections C1 canonical

on:
  push:
    branches:
      - 'gpt56/voynich-topology-v01'
    paths:
      - 'scripts/vms_textual_connections_c1_canonical.py'
      - '.github/workflows/vms-textual-connections-c1-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy requests scipy
      - name: Run canonical C1 with Voynich connections sealed
        run: python scripts/vms_textual_connections_c1_canonical.py
      - name: Upload canonical C1 results
        uses: actions/upload-artifact@v4
        with:
          name: vms-textual-connections-c1-canonical-v01
          path: artifacts/vms_textual_connections_c1_canonical_v01/
          if-no-files-found: error
          retention-days: 30
