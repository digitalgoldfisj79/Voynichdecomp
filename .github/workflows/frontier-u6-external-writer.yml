name: Frontier U6-v0.2 external writer instrument

on:
  push:
    branches:
      - experiment/voynich-frontier-programme-v0.1-20260814
    paths:
      - '.github/workflows/frontier-u6-external-writer.yml'
      - 'experiments/frontier_v0_1/U6_EXTERNAL_INSTRUMENT_PROTOCOL_v0_2.md'
      - 'experiments/frontier_v0_1/U6_IMPLEMENTATION_FREEZE_v0_2.md'
      - 'experiments/frontier_v0_1/src/u6_external_writer.py'

permissions:
  contents: write

jobs:
  external-writer-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact Frontier branch
        uses: actions/checkout@v4
        with:
          ref: experiment/voynich-frontier-programme-v0.1-20260814
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen visual dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<2.9' 'torchvision>=0.19,<0.24'
          pip install 'numpy<2' 'scikit-learn>=1.4,<1.6' 'opencv-python-headless>=4.10,<4.13' 'Pillow>=10,<12'
      - name: Download and verify ScriptNet ICDAR2017 binarized training corpus
        run: |
          set -euo pipefail
          mkdir -p external_data
          curl -fL --retry 12 --retry-delay 3 --retry-all-errors \
            'https://zenodo.org/records/1324999/files/icdar17-historicalwi-training-binarized.zip?download=1' \
            -o external_data/scriptnet.zip
          echo '3caa11320e857cf80694031a568ce6bf  external_data/scriptnet.zip' | md5sum -c -
          mkdir -p external_data/scriptnet
          unzip -q external_data/scriptnet.zip -d external_data/scriptnet
      - name: Train and lock external writer-sensitive instrument
        run: |
          python experiments/frontier_v0_1/src/u6_external_writer.py \
            --data external_data/scriptnet \
            --out experiments/frontier_v0_1/runs/2026-08-14/u6
      - name: Upload selected encoder as reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: u6-v02-external-encoder
          path: experiments/frontier_v0_1/runs/2026-08-14/u6/U6_EXTERNAL_ENCODER.pt
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist external gate result
        run: |
          git config user.name 'voynich-frontier-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/frontier_v0_1/runs/2026-08-14/u6/U6_EXTERNAL_RESULT.json
          if [ -f experiments/frontier_v0_1/runs/2026-08-14/u6/U6_EXTERNAL_RESULT.md ]; then
            git add experiments/frontier_v0_1/runs/2026-08-14/u6/U6_EXTERNAL_RESULT.md
          fi
          git diff --cached --quiet && exit 0
          git commit -m 'Record U6-v0.2 external writer instrument gate [skip ci]'
          git push origin HEAD:experiment/voynich-frontier-programme-v0.1-20260814
