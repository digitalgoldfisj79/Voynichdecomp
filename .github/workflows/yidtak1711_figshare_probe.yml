name: YidTak1711 Figshare/SURFdrive metadata probe

on:
  push:
    branches:
      - gpt56/yiddish-control-v1-20260912
    paths:
      - 'experiments/yiddish_cipher_control_v1/primary_bridge/TRIGGER_FIGSHARE_PROBE'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inventory linked public share via metadata-only WebDAV
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/figshare_probe
          mkdir -p "$OUT"
          curl --connect-timeout 10 --max-time 30 -L --fail --retry 1 'https://api.figshare.com/v2/articles/25422844' -o "$OUT/article.json"
          LINK=$(python3 -c "import json; x=json.load(open('$OUT/article.json')); print(x['files'][0]['download_url'])")
          TOKEN=${LINK##*/}
          printf 'link=%s\ntoken=%s\n' "$LINK" "$TOKEN" > "$OUT/share_pointer.txt"
          URL="https://surfdrive.surf.nl/public.php/dav/files/$TOKEN"
          BODY='<?xml version="1.0" encoding="UTF-8"?><d:propfind xmlns:d="DAV:"><d:prop><d:displayname/><d:getcontentlength/><d:getcontenttype/><d:getetag/><d:resourcetype/></d:prop></d:propfind>'
          set +e
          HTTP=$(curl --connect-timeout 10 --max-time 45 -sS -X PROPFIND -H 'Depth: 1' -H 'X-Requested-With: XMLHttpRequest' -H 'Content-Type: application/xml' --data "$BODY" -o "$OUT/propfind_depth1.xml" -w '%{http_code}' "$URL")
          RC=$?
          set -e
          printf 'curl_rc=%s\nhttp_status=%s\nurl=%s\n' "$RC" "$HTTP" "$URL" | tee "$OUT/status.txt"
          if [ "$RC" -eq 0 ] && [ "$HTTP" = '207' ]; then
            python3 - <<'PY'
          import pathlib, urllib.parse, xml.etree.ElementTree as ET
          p=pathlib.Path('/tmp/figshare_probe')
          root=ET.parse(p/'propfind_depth1.xml').getroot(); ns={'d':'DAV:'}; rows=[]
          for resp in root.findall('d:response',ns):
              href=urllib.parse.unquote(resp.findtext('d:href',default='',namespaces=ns) or '')
              prop=resp.find('.//d:prop',ns)
              if prop is None: continue
              name=prop.findtext('d:displayname',default='',namespaces=ns) or ''
              size=prop.findtext('d:getcontentlength',default='',namespaces=ns) or ''
              ctype=prop.findtext('d:getcontenttype',default='',namespaces=ns) or ''
              etag=prop.findtext('d:getetag',default='',namespaces=ns) or ''
              rt=prop.find('d:resourcetype',ns); is_dir=rt is not None and rt.find('d:collection',ns) is not None
              rows.append((href,name,size,ctype,etag,'DIR' if is_dir else 'FILE'))
          text='href\tdisplayname\tsize\tcontent_type\tetag\ttype\n'+'\n'.join('\t'.join(r) for r in rows)+'\n'
          (p/'inventory_depth1.tsv').write_text(text); print(text)
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yidtak1711-figshare-probe
          path: /tmp/figshare_probe
          retention-days: 30
