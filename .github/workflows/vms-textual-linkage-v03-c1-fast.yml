name: VMS pure-text linkage v0.3 C1 fast

on:
  push:
    branches: ['gpt56/voynich-topology-v01']
    paths:
      - 'scripts/vms_textual_linkage_v03_c1_fast.py'
      - '.github/workflows/vms-textual-linkage-v03-c1-fast.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  c1-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy requests
      - run: python scripts/vms_textual_linkage_v03_c1_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: vms-textual-linkage-v03-c1-fast
          path: artifacts/vms_textual_linkage_v03_c1_fast/
          if-no-files-found: error
          retention-days: 30
