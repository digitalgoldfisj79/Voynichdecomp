name: STA line-zone null v0.2

on:
  push:
    branches:
      - experiment/sta-line-zone-null-v0.2-20260815
    paths:
      - 'experiments/sta_line_zone_null_v0_2/**'
      - '.github/workflows/sta-line-zone-null-v0.2.yml'

permissions:
  contents: write

jobs:
  line-zone-null:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install 'numpy<2'
      - name: Compile frozen implementation
        run: |
          python -m py_compile \
            experiments/sta_line_zone_null_v0_2/run_line_zone_null.py \
            experiments/sta_line_zone_null_v0_2/run_line_zone_null_exec.py \
            experiments/sta_line_zone_null_v0_2/run_build_checks.py
      - name: Run target-blind build checks
        run: python experiments/sta_line_zone_null_v0_2/run_build_checks.py
      - name: Resolve full-run gate
        id: gate
        shell: bash
        run: |
          if [[ -f experiments/sta_line_zone_null_v0_2/EXECUTE_FULL_20260815.txt ]]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Acquire canonical RF1b STA source
        if: steps.gate.outputs.full == 'true'
        run: |
          curl --fail --location --retry 3 --output /tmp/RF1b.txt https://voynich.nu/data/sta/RF1b.txt
          echo '81c331b7d8e76761e27d350c3b37ccfbe192848e6c8a227bcb5d40fb29259b17  /tmp/RF1b.txt' | sha256sum --check --strict
      - name: Run frozen full line-zone discriminator
        if: steps.gate.outputs.full == 'true'
        run: python experiments/sta_line_zone_null_v0_2/run_line_zone_null_exec.py /tmp/RF1b.txt
      - name: Commit deterministic results
        if: steps.gate.outputs.full == 'true'
        run: |
          git config user.name 'voynich-line-zone-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add results/sta_line_zone_null_v0_2/
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'Add STA line-zone null v0.2 results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.full == 'true' && always()
        with:
          name: sta-line-zone-null-v0.2-results
          path: results/sta_line_zone_null_v0_2/
