name: Yiddish qualification v1b finite-panel R
on:
  push:
    branches:
      - gpt56/yiddish-qualification-v1b-20260912
    paths:
      - 'experiments/yiddish_qualification_v1b/**'
      - '.github/workflows/yiddish_qualification_v1b.yml'
  workflow_dispatch:
jobs:
  run-r-normalized-v02:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repaired fresh-source finite-panel R benchmark
        run: python experiments/yiddish_qualification_v1b/finite_panel_r_v02.py
      - name: Upload complete audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yiddish-qualification-v1b-r-normalized
          path: experiments/yiddish_qualification_v1b/run_output_v02/
          if-no-files-found: error
