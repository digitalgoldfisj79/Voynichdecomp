name: SVT v0.4 Hidden Segmentation Gate

on:
  pull_request:
    branches:
      - experiment/svt-primitive-period-v0.3.4-20260821
    paths:
      - 'experiments/stateful_verbose_transducer_v0_1/SVT_V04_HIDDEN_SEGMENTATION_PROTOCOL.md'
      - 'experiments/stateful_verbose_transducer_v0_1/v04_semimarkov_segmenter.py'
      - 'experiments/stateful_verbose_transducer_v0_1/run_v04_segmentation_gate.py'
      - 'experiments/stateful_verbose_transducer_v0_1/aggregate_v04_segmentation_gate.py'
      - '.github/workflows/svt-v04-hidden-segmentation.yml'

permissions:
  contents: read

jobs:
  trial:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        mode: [periodic, line_reset]
        replicate: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy numba rapidfuzz
      - name: Compile
        run: |
          python -m py_compile \
            experiments/stateful_verbose_transducer_v0_1/svt_v01.py \
            experiments/stateful_verbose_transducer_v0_1/svt_v02.py \
            experiments/stateful_verbose_transducer_v0_1/v04_semimarkov_segmenter.py \
            experiments/stateful_verbose_transducer_v0_1/run_v04_segmentation_gate.py
      - name: Run fresh hidden segmentation trial
        run: |
          mkdir -p results
          python experiments/stateful_verbose_transducer_v0_1/run_v04_segmentation_gate.py \
            --repo . --mode '${{ matrix.mode }}' --replicate '${{ matrix.replicate }}' \
            --output 'results/svt_v04_seg_${{ matrix.mode }}_${{ matrix.replicate }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: svt-v04-seg-${{ matrix.mode }}-${{ matrix.replicate }}
          path: results/*.json

  aggregate:
    needs: [trial]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: svt-v04-seg-*
          path: gathered
          merge-multiple: false
      - name: Aggregate S0 gate
        continue-on-error: true
        run: |
          mkdir -p results
          python experiments/stateful_verbose_transducer_v0_1/aggregate_v04_segmentation_gate.py \
            --input-dir gathered --output results/svt_v04_seg_gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: svt-v04-seg-gate
          path: results/svt_v04_seg_gate.json
          if-no-files-found: error
      - name: Enforce binding verdict
        run: |
          python - <<'PY'
          import json
          p=json.load(open('results/svt_v04_seg_gate.json'))
          if not p.get('gate_pass'):
              raise SystemExit(2)
          print('SVT v0.4 S0 PASS')
          PY
