name: La Sfera textual tradition stage 2 live

on:
  push:
    branches:
      - research/la-sfera-textual-20260908
    paths:
      - 'research/la_sfera_textual_stage2_live.py'
      - '.github/workflows/la-sfera-textual-stage2-live.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run live export test
        run: python research/la_sfera_textual_stage2_live.py research_out_live
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: la-sfera-stage2-live-result
          path: |
            research_out_live/result_live.json
            research_out_live/summary_live.md
            research_out_live/exports_meta.json
            research_out_live/*.csv
          retention-days: 7
