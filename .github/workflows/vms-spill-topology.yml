name: VMS spill topology v01

on:
  push:
    branches:
      - 'gpt56/voynich-topology-v01'
    paths:
      - 'scripts/vms_spill_topology.py'
      - '.github/workflows/vms-spill-topology.yml'
  pull_request:
    paths:
      - 'scripts/vms_spill_topology.py'
      - '.github/workflows/vms-spill-topology.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure-spill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pillow requests
      - name: Measure upper-margin spill
        run: python scripts/vms_spill_topology.py
      - name: Upload measurements
        uses: actions/upload-artifact@v4
        with:
          name: vms-spill-topology-v01
          path: artifacts/vms_spill_v01/
          if-no-files-found: error
          retention-days: 30
