name: Taccola v0.2 local-shape round 2

on:
  push:
    branches:
      - gpt56/taccola-q13-calibration-v0.2-motif-20260830
    paths:
      - 'research/taccola_q13/motif_v02_round2.py'
      - '.github/workflows/taccola-v02-round2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: research/taccola_q13

jobs:
  round2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy opencv-python-headless pillow requests
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: digitalgoldfisj79/Voynichdecomp
          run-id: 33300853008
          pattern: taccola-complete-one-*
          path: dev_inputs
          merge-multiple: true
      - name: Run final local-shape development round
        run: python research/taccola_q13/motif_v02_round2.py --input dev_inputs
      - name: Publish summary
        if: always()
        run: |
          if [ -f taccola_v02_round2/ROUND2.md ]; then cat taccola_v02_round2/ROUND2.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taccola-v02-round2
          path: taccola_v02_round2/**
          if-no-files-found: warn
          retention-days: 30
