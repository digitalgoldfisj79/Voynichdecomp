name: velinska-artifact-to-branch

# One-off: copy the velinska_backfill artifact from run 38434621959 into
# velinska_backfill_output/ on this branch so it can be read via git.
on:
  push:
    branches: [velinska-backfill]
    paths:
      - .github/workflows/velinska-artifact-to-branch.yml

permissions:
  contents: write
  actions: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: velinska_backfill
          run-id: 38434621959
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: velinska_backfill_output
      - name: Commit to branch
        run: |
          ls -la velinska_backfill_output
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add velinska_backfill_output
          git commit -m "Add velinska_backfill artifact from run 38434621959"
          git push origin HEAD:velinska-backfill
