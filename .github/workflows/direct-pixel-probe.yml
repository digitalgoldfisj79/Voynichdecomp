name: Direct pixel source probe

on:
  push:
    branches:
      - gpt56/direct-pixel-boundary-scale-v0.1-20260820
    paths:
      - '.github/workflows/direct-pixel-probe.yml'
      - 'experiments/direct_pixel_boundary/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe public source schemas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          curl -fL --retry 3 'https://www.voynichese.com/1/data/folio/script/f1r.js' -o probe/f1r.js
          curl -fL --retry 3 'https://www.voynichese.com/1/data/folio/voynichese_data.zip' -o probe/voynichese_data.zip
          curl -fL --retry 3 'https://collections.library.yale.edu/manifests/2002046' -o probe/yale_manifest.json
          echo '=== f1r.js head ==='
          head -c 12000 probe/f1r.js
          echo
          echo '=== ZIP first entries ==='
          unzip -l probe/voynichese_data.zip | head -30
          echo '=== sample XML ==='
          FIRST=$(unzip -Z1 probe/voynichese_data.zip | grep -Ei '\.xml$' | head -1)
          echo "$FIRST"
          unzip -p probe/voynichese_data.zip "$FIRST" | head -c 12000
          echo
          echo '=== Yale manifest canvas labels / services sample ==='
          python - <<'PY'
          import json
          d=json.load(open('probe/yale_manifest.json'))
          print('items',len(d.get('items',[])))
          for c in d.get('items',[])[:12]:
              label=c.get('label')
              body=((c.get('items') or [{}])[0].get('items') or [{}])[0].get('body') or {}
              print(label, body.get('id'), body.get('service'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: direct-pixel-probe
          path: probe/
          retention-days: 3
