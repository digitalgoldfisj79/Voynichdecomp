name: Sobel available-corpus frozen rerank and visual validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sobel-full-postprocess.yml'
      - 'experiments/sobel_shape_search/full_postprocess.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  postprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen rerank dependencies
        run: python -m pip install --disable-pip-version-check requests pillow numpy opencv-python-headless
      - name: Compile postprocessor
        run: python -m py_compile experiments/sobel_shape_search/full_postprocess.py
      - name: Rerank all currently available r10 cells, global top 500 to top 100, render top 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python experiments/sobel_shape_search/full_postprocess.py \
            --run-id 32341056376 \
            --outdir full_postprocess
          cat full_postprocess/SOBEL_FULL_POSTPROCESS_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sobel-r10-available-194of224-reranked-visual
          path: |
            full_postprocess/sobel_full_reranked.json
            full_postprocess/sobel_full_reranked_top100.csv
            full_postprocess/sobel_full_top20.jpg
            full_postprocess/sobel_full_top20.json
            full_postprocess/SOBEL_FULL_POSTPROCESS_REPORT.md
            full_postprocess/crops/
          if-no-files-found: warn
          retention-days: 14
