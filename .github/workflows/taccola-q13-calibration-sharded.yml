name: Taccola Q13 calibration v0.1b sharded

on:
  push:
    branches:
      - gpt56/taccola-q13-calibration-v0.1-repair-20260830
    paths:
      - 'research/taccola_q13/extract_shard.py'
      - 'research/taccola_q13/aggregate_shards.py'
      - '.github/workflows/taccola-q13-calibration-sharded.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: research/taccola_q13

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repaired scientific core and panel
        run: python research/taccola_q13/verify_repair.py
      - uses: actions/upload-artifact@v4
        with:
          name: taccola-sharded-repair-audit
          path: taccola_calibration_output/repair_audit.json
          retention-days: 14

  features:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pillow requests opencv-python-headless
      - name: Extract frozen features shard
        run: python research/taccola_q13/extract_shard.py --shard ${{ matrix.shard }} --nshards 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taccola-features-shard-${{ matrix.shard }}
          path: taccola_shard_output/**
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: features
    if: always() && needs.features.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pillow requests opencv-python-headless
      - uses: actions/download-artifact@v4
        with:
          pattern: taccola-features-shard-*
          path: shard_inputs
          merge-multiple: true
      - name: Aggregate manuscript blocks and run frozen gates
        run: python research/taccola_q13/aggregate_shards.py --input shard_inputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taccola-q13-calibration-v01b-sharded-result
          path: taccola_sharded_result/**
          if-no-files-found: warn
          retention-days: 14
