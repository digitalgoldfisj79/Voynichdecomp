name: XD1 exact-lag bridge

on:
  push:
    branches:
      - supergrammar-v03-crossdomain-controls-20260920
    paths:
      - .github/workflows/xd1-exact-lag-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-lag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Run frozen exact-lag bridge
        run: python research/xd1_exact_lag_bridge_20260920.py
