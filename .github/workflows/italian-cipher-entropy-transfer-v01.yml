name: Northern Italian Cipher Entropy Transfer v0.1

on:
  push:
    branches:
      - experiment/italian-cipher-entropy-transfer-v0.1-20260815
    paths:
      - .github/workflows/italian-cipher-entropy-transfer-v01.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external_entropy_transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify frozen runner
        shell: bash
        run: |
          set -euo pipefail
          EXP="experiments/italian_cipher_entropy_transfer_v0_1"
          base64 -d "$EXP/run_entropy_transfer_v01.py.gz.b64" | gzip -d > "$EXP/run_entropy_transfer_v01.py"
          echo "a1d5ad2d18fec6f657e6f89248b1ac726e2909fc184774d9e75eb87569d57963  $EXP/run_entropy_transfer_v01.py" | sha256sum -c -
          echo "27b9afa2a7b08d322e2001e45d832aef83245266e368add31066f602243ef8f7  $EXP/run_entropy_transfer_v01.py.gz.b64" | sha256sum -c -
          python -m py_compile "$EXP/run_entropy_transfer_v01.py"
          sha256sum "$EXP/PROTOCOL_ENTROPY_TRANSFER_V01.md" "$EXP/AMENDMENT_001_MICROPARAMETERS.md" "$EXP/SOURCE_MANIFEST.json" "$EXP/run_entropy_transfer_v01.py"

      - name: Hostile firewall and unit tests
        shell: bash
        run: |
          set -euo pipefail
          EXP="experiments/italian_cipher_entropy_transfer_v0_1"
          if grep -Eqi 'voynich\.nu|RF1b|STA-aaa|bitrans|target_inputs' "$EXP/run_entropy_transfer_v01.py" "$EXP/SOURCE_MANIFEST.json"; then
            echo 'TARGET FIREWALL FAIL: target acquisition token found in runner/manifest' >&2
            exit 1
          fi
          python "$EXP/run_entropy_transfer_v01.py" test

      - name: Download frozen external source families
        shell: bash
        run: |
          set -euo pipefail
          EXP="experiments/italian_cipher_entropy_transfer_v0_1"
          mkdir -p "$EXP/external/controls"
          python - <<'PY'
          import json, pathlib, urllib.request
          exp=pathlib.Path('experiments/italian_cipher_entropy_transfer_v0_1')
          fams=json.loads((exp/'SOURCE_MANIFEST.json').read_text())['families']
          for fam,spec in fams.items():
              if not isinstance(spec,list):
                  continue
              d=exp/'external'/'controls'/fam; d.mkdir(parents=True,exist_ok=True)
              for u in spec:
                  name=u.rsplit('/',1)[-1]
                  print('DOWNLOAD',fam,u)
                  urllib.request.urlretrieve(u,d/name)
          PY
          curl -fL --retry 3 --retry-delay 2 \
            'https://www.uni-giessen.de/de/fbz/fb05/germanistik/absprache/sprachverwendung/gloning/tx/bvgs.htm' \
            -o "$EXP/external/bvgs.htm"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/HTR-United/CREMMA-Medieval-LAT.git "$EXP/external/cremma_repo"
          git -C "$EXP/external/cremma_repo" sparse-checkout set data
          test -f "$EXP/external/cremma_repo/data-registry.csv"
          find "$EXP/external/controls" -type f -print0 | sort -z | xargs -0 sha256sum > "$EXP/external/source_hashes.sha256"
          sha256sum "$EXP/external/bvgs.htm" >> "$EXP/external/source_hashes.sha256"
          git -C "$EXP/external/cremma_repo" rev-parse HEAD > "$EXP/external/cremma_commit.txt"
          cat "$EXP/external/source_hashes.sha256"
          echo -n 'CREMMA_COMMIT '; cat "$EXP/external/cremma_commit.txt"

      - name: Run external-only transfer map
        shell: bash
        run: |
          set -uo pipefail
          EXP="experiments/italian_cipher_entropy_transfer_v0_1"
          mkdir -p "$EXP/results"
          PYTHONUNBUFFERED=1 python "$EXP/run_entropy_transfer_v01.py" run \
            --controls "$EXP/external/controls" \
            --cremma "$EXP/external/cremma_repo" \
            --bvgs "$EXP/external/bvgs.htm" \
            --out "$EXP/results" 2>&1 | tee "$EXP/entropy_transfer_run.log"
          RC=${PIPESTATUS[0]}
          echo "$RC" > "$EXP/results/runner_exit_code.txt"
          echo "RUNNER_EXIT_CODE=$RC"
          exit 0

      - name: Print decisive external result
        if: always()
        shell: bash
        run: |
          EXP="experiments/italian_cipher_entropy_transfer_v0_1"
          echo '=== RUNNER EXIT ==='
          cat "$EXP/results/runner_exit_code.txt" 2>/dev/null || true
          echo '=== SANITY ==='
          cat "$EXP/results/sanity.json" 2>/dev/null || true
          echo '=== TRANSFER MAP COMPACT ==='
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('experiments/italian_cipher_entropy_transfer_v0_1/results/transfer_map.json')
          if not p.exists():
              print('NO_TRANSFER_MAP'); raise SystemExit
          d=json.loads(p.read_text())
          print('STATUS',d.get('status'))
          print('FAMILIES',d.get('families'))
          print('GATES',json.dumps(d.get('gates',{}),sort_keys=True))
          for mech in ['HOM2','HOM34','HOM34_NULL_2p5','NOM50','BIGRAM20','BIGRAM20_DIGLYPH50','COMBINED_MID','ORTHO_POST1460']:
              if mech not in d.get('transfer',{}): continue
              print('MECHANISM',mech)
              for rep in ['ATOMIC','GLYPH']:
                  bits=[]
                  for m in ['H0','H1','MI1','expansion','info_rate']:
                      x=d['transfer'][mech][rep][m]
                      bits.append(f"{m}={x['cross_family_median']:.6f}:{x['status']}")
                  print(rep,' '.join(bits))
          PY

      - name: Upload audit-complete external artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: italian-cipher-entropy-transfer-v01-results
          retention-days: 30
          if-no-files-found: error
          path: |
            experiments/italian_cipher_entropy_transfer_v0_1/PROTOCOL_ENTROPY_TRANSFER_V01.md
            experiments/italian_cipher_entropy_transfer_v0_1/AMENDMENT_001_MICROPARAMETERS.md
            experiments/italian_cipher_entropy_transfer_v0_1/SOURCE_MANIFEST.json
            experiments/italian_cipher_entropy_transfer_v0_1/run_entropy_transfer_v01.py
            experiments/italian_cipher_entropy_transfer_v0_1/run_entropy_transfer_v01.py.gz.b64
            experiments/italian_cipher_entropy_transfer_v0_1/external/source_hashes.sha256
            experiments/italian_cipher_entropy_transfer_v0_1/external/cremma_commit.txt
            experiments/italian_cipher_entropy_transfer_v0_1/results/
            experiments/italian_cipher_entropy_transfer_v0_1/entropy_transfer_run.log
