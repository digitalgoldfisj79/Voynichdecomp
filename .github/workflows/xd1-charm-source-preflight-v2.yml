name: XD1 charm source preflight v2
on:
  push:
    branches: [supergrammar-xd1-charm-20260928]
    paths:
      - 'research/xd1_charm_source_preflight_v2.py'
      - '.github/workflows/xd1-charm-source-preflight-v2.yml'
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/xd1_charm_source_preflight_v2.py
      - name: Source-only guard
        run: |
          python - <<'PY'
          import json
          p=json.load(open('xd1_charm_preflight_v2/source_preflight_v2.json'))
          assert p['outcomes_computed'] is False
          s=json.dumps(p).lower()
          for x in ['observed_rate','null_mean','obs_null_ratio','signed_effect']:
              assert x not in s
          print('SOURCE_ONLY_GUARD=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xd1-charm-source-preflight-v2
          path: xd1_charm_preflight_v2/
