name: fractionation-signature-gate-v01

on:
  push:
    branches:
      - experiment/fractionation-signature-gate-v0.1-20260902
    paths:
      - experiments/fractionation_signature_gate_v0_1/fractionation_signature_gate_v01.py
      - experiments/fractionation_signature_gate_v0_1/PROTOCOL_V010.md
      - .github/workflows/fractionation-signature-gate-v01.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/fractionation-signature-gate-v0.1-20260902
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scikit-learn
      - name: Run locked synthetic gate
        run: |
          set -o pipefail
          python experiments/fractionation_signature_gate_v0_1/fractionation_signature_gate_v01.py \
            --repo . \
            --output experiments/fractionation_signature_gate_v0_1/results_v010.json \
            --replicates 32 | tee experiments/fractionation_signature_gate_v0_1/run_v010.log
      - name: Persist result on experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/fractionation_signature_gate_v0_1/results_v010.json experiments/fractionation_signature_gate_v0_1/run_v010.log
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record locked fractionation signature gate v0.1 results"
            git push origin HEAD:experiment/fractionation-signature-gate-v0.1-20260902
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fractionation-signature-gate-v010
          path: |
            experiments/fractionation_signature_gate_v0_1/results_v010.json
            experiments/fractionation_signature_gate_v0_1/run_v010.log
