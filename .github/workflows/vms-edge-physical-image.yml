name: VMS edge physical image v01

on:
  push:
    branches:
      - 'gpt56/voynich-topology-v01'
    paths:
      - 'scripts/vms_edge_physical_image.py'
      - 'protocols/vms_edge_forensics_physical_image_addendum_v01.md'
      - '.github/workflows/vms-edge-physical-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy requests pillow
      - name: Run candidate-blind physical image assay
        run: python scripts/vms_edge_physical_image.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: vms-edge-physical-image-v01
          path: artifacts/vms_edge_physical_image_v01/
          if-no-files-found: error
          retention-days: 30
