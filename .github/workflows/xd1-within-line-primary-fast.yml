name: XD1 within-line lag1-lag2 fast

on:
  push:
    branches:
      - supergrammar-v03-crossdomain-controls-20260920
    paths:
      - .github/workflows/xd1-within-line-primary-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Run frozen primary within-line lag1/lag2 bridge
        run: python research/xd1_within_line_primary_fast_20260920.py
