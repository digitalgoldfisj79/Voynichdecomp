name: V5 primary top20 recurrence

on:
  push:
    branches:
      - programme-v5-frequency-20260923
    paths:
      - research/v5_frequency_matched_primary_20260923.py
      - .github/workflows/v5-primary-top20-20260923.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v5-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run primary top20 test
        run: python research/v5_frequency_matched_primary_20260923.py | tee v5_primary.log
      - uses: actions/upload-artifact@v4
        with:
          name: v5-primary-top20-20260923
          path: |
            research/RESULTS_v5_frequency_matched_PRIMARY_20260923.json
            research/v5_primary_checkpoints/
            v5_primary.log
