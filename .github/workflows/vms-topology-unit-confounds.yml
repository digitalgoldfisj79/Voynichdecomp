name: VMS topology strict unit confounds

on:
  push:
    branches:
      - 'gpt56/voynich-topology-v01'
    paths:
      - 'scripts/vms_topology_unit_confounds.py'
      - '.github/workflows/vms-topology-unit-confounds.yml'
  pull_request:
    paths:
      - 'scripts/vms_topology_unit_confounds.py'
      - '.github/workflows/vms-topology-unit-confounds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-unit-confounds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy requests
      - name: Run strict unit confound control
        run: python scripts/vms_topology_unit_confounds.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: vms-topology-unit-confounds-v01
          path: artifacts/vms_topology_unit_confounds_v01/
          if-no-files-found: error
          retention-days: 30
