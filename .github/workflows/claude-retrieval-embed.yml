name: Claude retrieval embeddings

# Backfill trigger: unified chunk corpus staged 2026-09-07.
on:
  workflow_dispatch:
    inputs:
      fetch_size:
        description: Rows fetched from Supabase per cycle
        required: false
        default: "128"
      encode_size:
        description: CPU model batch size
        required: false
        default: "32"
  push:
    branches: [main]
    paths:
      - scripts/embed_claude_retrieval.py
      - .github/workflows/claude-retrieval-embed.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: claude-retrieval-embeddings
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CLAUDE_RETRIEVAL_EDGE_URL: https://ymaqlcfjmdwncdbjprmw.supabase.co/functions/v1/claude-voynich-search-v01
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install embedding runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.4,<3" "transformers>=4.44,<5" "requests>=2.32,<3"

      - name: Embed pending retrieval chunks
        run: |
          python scripts/embed_claude_retrieval.py \
            --fetch-size "${{ inputs.fetch_size || '128' }}" \
            --encode-size "${{ inputs.encode_size || '32' }}"
