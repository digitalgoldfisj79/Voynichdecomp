name: SVT v0.1 synthetic smoke

on:
  push:
    branches:
      - experiment/stateful-verbose-transducer-v0.1-20260821
    paths:
      - 'experiments/stateful_verbose_transducer_v01/**'
      - '.github/workflows/svt-v01-smoke.yml'
  pull_request:
    paths:
      - 'experiments/stateful_verbose_transducer_v01/**'
      - '.github/workflows/svt-v01-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade numpy numba rapidfuzz
      - name: Compile
        run: python -m py_compile experiments/stateful_verbose_transducer_v01/svt_v01.py
      - name: Oracle-boundary smoke
        run: |
          python experiments/stateful_verbose_transducer_v01/svt_v01.py \
            --repo . \
            --stage oracle_boundaries \
            --iso de \
            --length 48 \
            --replicates 1 \
            --output /tmp/svt_oracle_boundary_smoke.json
      - name: Hidden-boundary smoke
        continue-on-error: true
        run: |
          python experiments/stateful_verbose_transducer_v01/svt_v01.py \
            --repo . \
            --stage oracle_schedule \
            --iso de \
            --length 48 \
            --replicates 1 \
            --output /tmp/svt_hidden_boundary_smoke.json
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svt-v01-smoke
          path: /tmp/svt_*_smoke.json
          if-no-files-found: ignore
