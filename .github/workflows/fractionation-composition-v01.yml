name: fractionation-composition-v01

on:
  push:
    branches:
      - experiment/fractionation-composition-v0.1-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic development gate
        run: |
          python experiments/fractionation_composition_v0_1/fractionation_composition_v01.py \
            --repo "$GITHUB_WORKSPACE" \
            --output experiments/fractionation_composition_v0_1/results/dev_gate_v01.json \
            --split dev \
            --reps 12 \
            --target-letters 600 \
            --null-reps 99
      - name: Upload gate result
        uses: actions/upload-artifact@v4
        with:
          name: fractionation-composition-v01-dev
          path: experiments/fractionation_composition_v0_1/results/dev_gate_v01.json
          if-no-files-found: error
