name: fractionation-composition-v01a

on:
  push:
    branches:
      - experiment/fractionation-composition-v0.1-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v0.1a development gate
        run: |
          python experiments/fractionation_composition_v0_1/fractionation_composition_v01a.py \
            --repo "$GITHUB_WORKSPACE" \
            --output experiments/fractionation_composition_v0_1/results/dev_gate_v01a.json \
            --split dev \
            --reps 4 \
            --target-letters 400 \
            --null-reps 39
      - name: Upload v0.1a result
        uses: actions/upload-artifact@v4
        with:
          name: fractionation-composition-v01a-dev
          path: experiments/fractionation_composition_v0_1/results/dev_gate_v01a.json
          if-no-files-found: error
