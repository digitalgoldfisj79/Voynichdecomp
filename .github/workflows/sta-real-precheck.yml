name: STA real representation precheck
on:
  push:
    branches:
      - experiment/sta-boundary-robustness-v0.1-20260815
    paths:
      - 'experiments/sta_boundary_robustness_v0_1/run_sta_real_precheck.py'
      - '.github/workflows/sta-real-precheck.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real-precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2'
      - name: Acquire canonical RF1b STA source
        run: curl --fail --location --retry 3 --output /tmp/RF1b.txt https://voynich.nu/data/sta/RF1b.txt
      - name: Run frozen real-STA gates
        run: python experiments/sta_boundary_robustness_v0_1/run_sta_real_precheck.py /tmp/RF1b.txt
      - name: Commit precheck result
        run: |
          git config user.name 'voynich-recovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add results/sta_boundary_robustness_v0_1/REAL_PRECHECK_20260815.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add STA real representation precheck'
            git push
          fi
