name: Historical notation calibration v0.4

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/voynich-notation-historical-calibration-v0.4-20260724
    paths:
      - '.github/workflows/historical-notation-calibration-v04.yml'
      - 'experiments/notation_packet_v0_4/FROZEN_PROTOCOL_HISTORICAL_NOTATION_v0_4.md'
      - 'experiments/notation_packet_v0_4/scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/historical-notation-calibration-v04.yml'
      - 'experiments/notation_packet_v0_4/**'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn

      - name: Reconstruct frozen classifier
        run: |
          cd experiments/notation_packet_v0_4/scripts
          cat run_historical_notation_classifier_v04.py.part1 \
              run_historical_notation_classifier_v04.py.part2 \
              run_historical_notation_classifier_v04.py.part3 \
              > run_historical_notation_classifier_v04.py
          python -m py_compile surface_features_v04.py run_historical_notation_classifier_v04.py run_external_calibration_only_v04.py

      - name: Download public AmmerbachReal calibration corpus
        run: |
          mkdir -p external/ammerbach
          wget --retry-connrefused --waitretry=5 --read-timeout=60 --timeout=60 \
            -O external/Ammerbach.tar \
            'https://open.uni-marburg.de/server/api/core/bitstreams/36a19f39-4439-412e-8181-dedd8a710bc4/content'
          test "$(stat -c%s external/Ammerbach.tar)" -gt 700000000
          tar -xf external/Ammerbach.tar -C external/ammerbach
          test "$(find external/ammerbach -type f -name '*.txt' | wc -l)" -ge 2400

      - name: Download complete public GABC/MEI calibration corpus
        run: git clone --depth 1 https://github.com/ECHOES-from-the-Past/GABCtoMEI.git external/GABCtoMEI

      - name: Run sealed external calibration
        run: |
          rm -rf experiments/notation_packet_v0_4/results
          mkdir -p experiments/notation_packet_v0_4/results
          python experiments/notation_packet_v0_4/scripts/run_external_calibration_only_v04.py \
            --ammerbach-dir external/ammerbach \
            --gabc-dir external/GABCtoMEI \
            --out experiments/notation_packet_v0_4/results | tee experiments/notation_packet_v0_4/results/run.log

      - name: Build result manifest
        run: |
          cd experiments/notation_packet_v0_4/results
          sha256sum * > SHA256SUMS.txt
          python - <<'PY'
          import json
          r=json.load(open('external_notation_calibration_results_v0_4.json'))
          assert r['voynich_opened'] is False
          print(json.dumps({
            'selected':r['selected_representation'],
            'external_gate':r['external_gate_pass'],
            'family_gate':r['family_gate_pass'],
            'annotations':r['ammerbach_audit']['annotations_parsed'],
            'gabc_files':r['gabc_audit']['files']
          },indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: historical-notation-calibration-v0.4
          path: experiments/notation_packet_v0_4/results
          if-no-files-found: error
          retention-days: 90

      - name: Commit immutable external results
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/notation_packet_v0_4/scripts/run_historical_notation_classifier_v04.py experiments/notation_packet_v0_4/results
          if ! git diff --cached --quiet; then
            git commit -m 'Run historical notation external calibration v0.4 [skip ci]'
            git push origin HEAD:experiment/voynich-notation-historical-calibration-v0.4-20260724
          fi
