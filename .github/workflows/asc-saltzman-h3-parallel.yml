name: ASC Saltzman H3 Parallel

on:
  push:
    branches:
      - experiment/saltzman-state-h3-20260814
    paths:
      - .github/workflows/asc-saltzman-h3-parallel.yml

permissions:
  contents: read

jobs:
  h3-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet numpy regex
      - name: Restore frozen H3 payload
        shell: bash
        run: |
          mkdir -p /tmp/saltzman_h3
          cat saltzman_h3/h3part00.txt saltzman_h3/h3part01.txt saltzman_h3/h3part02.txt saltzman_h3/h3part03.txt saltzman_h3/h3part04.txt > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.zip
          cd /tmp/saltzman_h3
          unzip -q /tmp/payload.zip
          mkdir -p results inputs
          sha256sum /tmp/payload.zip
      - name: Build canonical ReM lineation
        working-directory: /tmp/saltzman_h3
        shell: bash
        run: |
          set -o pipefail
          python build_rem_lineation.py --work /tmp/rem_lineation_build | tee H3_LINEATION_BUILD.log
      - name: Write execution-only parallel runner
        working-directory: /tmp/saltzman_h3
        shell: bash
        run: |
          cat > run_h3_parallel.py <<'PY'
          from pathlib import Path
          from concurrent.futures import ProcessPoolExecutor, as_completed
          import json,lzma,os
          import numpy as np
          import scorer
          import run_h3_line_end as h3
          from mechanisms import self_tests as mechanism_self_tests
          ROOT=Path(__file__).resolve().parent
          N=min(5,os.cpu_count() or 1)
          REM=None
          def init_rem():
              global REM
              REM=json.loads(lzma.decompress((ROOT/'inputs'/'rem_lineation.json.xz').read_bytes()).decode('utf-8'))
          def local_one(corp):
              panel={m['corpus']:m for m in json.loads((ROOT/'PANEL_FROZEN.json').read_text())}
              plain=scorer.load_plain(ROOT/panel[corp]['file']); out=[]
              for arm in h3.ARMS:
                  for repn in h3.REPS:
                      out.append(h3.score_cell(corp,plain,arm,repn,100,200,'LOCAL'))
              return corp,out
          def fresh_one(rec):
              did=rec['doc_id']; plain=h3.cap_lines(REM[did],2000); out=[]
              for arm in h3.ARMS:
                  for repn in h3.REPS:
                      out.append(h3.score_cell(did,plain,arm,repn,100,200,'FRESH'))
              return did,out
          def main():
              mechanism_self_tests(); scorer.self_test_ed1()
              lcells=[]
              with ProcessPoolExecutor(max_workers=min(N,3)) as ex:
                  fs=[ex.submit(local_one,c) for c in h3.LOCAL]
                  for f in as_completed(fs):
                      n,c=f.result(); print('LOCAL DONE',n,flush=True); lcells.extend(c)
              lcells.sort(key=lambda x:(x['corpus'],x['arm'],x['representation']))
              (ROOT/'results'/'H3_LOCAL_LINES.json').write_text(json.dumps({'cells':lcells},ensure_ascii=False),encoding='utf-8')
              fresh=json.loads((ROOT/'REM_FRESH_PANELS.json').read_text())['H3_LINE_END']; fcells=[]
              with ProcessPoolExecutor(max_workers=N,initializer=init_rem) as ex:
                  fs=[ex.submit(fresh_one,r) for r in fresh]
                  for f in as_completed(fs):
                      n,c=f.result(); print('FRESH DONE',n,flush=True); fcells.extend(c)
              fcells.sort(key=lambda x:(x['corpus'],x['arm'],x['representation']))
              end=h3.robust(fcells,'LINE_END_REFRESH'); start=h3.robust(fcells,'LINE_START_REFRESH_NEGATIVE_CONTROL')
              paired={d:{'end':end[d],'start':start[d],'end_better':end[d]<start[d]} for d in end if d in start}
              wins=sum(v['end_better'] for v in paired.values())
              me=float(np.median([v['end'] for v in paired.values()])); ms=float(np.median([v['start'] for v in paired.values()]))
              summary={'n_docs':len(paired),'end_better':wins,'required':24,'median_end_robust_d3':me,'median_start_robust_d3':ms,'fresh_gate':bool(len(paired)==35 and wins>=24 and me<ms)}
              (ROOT/'results'/'H3_FRESH_REM.json').write_text(json.dumps({'cells':fcells,'summary':summary,'paired':paired},ensure_ascii=False),encoding='utf-8')
              print(json.dumps(summary,indent=2))
          if __name__=='__main__': main()
          PY
          cat > EXECUTION_AMENDMENT_H3_PARALLEL.md <<'EOF'
          # H3 execution amendment
          H3 was parallelised across already frozen cells solely to reduce wall-clock time. Corpus membership, plaintext, authentic ReM lineation, mechanisms, representations, replicate counts, null-permutation counts, seeds, target vector, gates and decision rule are unchanged. A missing runtime dependency (`regex`) was added after the first execution attempt failed before scoring; pipelines were also changed to propagate Python failures. No scientific result existed from the failed attempt.
          EOF
      - name: Run frozen H3 in parallel
        working-directory: /tmp/saltzman_h3
        shell: bash
        run: |
          set -o pipefail
          python run_h3_parallel.py | tee H3_RUN.log
      - name: Build result manifest
        if: always()
        working-directory: /tmp/saltzman_h3
        run: |
          find inputs results -maxdepth 1 -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum > H3_RESULT_MANIFEST.sha256
      - name: Upload H3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asc-saltzman-h3-parallel-20260814
          path: |
            /tmp/saltzman_h3/results/
            /tmp/saltzman_h3/inputs/rem_lineation.json.xz
            /tmp/saltzman_h3/inputs/rem_lineation_qc.json
            /tmp/saltzman_h3/H3_RESULT_MANIFEST.sha256
            /tmp/saltzman_h3/H3_LINEATION_BUILD.log
            /tmp/saltzman_h3/H3_RUN.log
            /tmp/saltzman_h3/EXECUTION_AMENDMENT_H3_PARALLEL.md
          if-no-files-found: warn
          retention-days: 7
