name: Sobel manuscript shape search pilot

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/sobel_shape_search/**'
      - '.github/workflows/sobel-shape-search.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SUPABASE_URL: https://ymaqlcfjmdwncdbjprmw.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_9MpT1VOi0nvF-2N1LIS4Ew_h5dQWcp2
  RELEASE_ID: 2026-08-19-r10
  MAX_ITEMS: '750'
  TOP_K: '100'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 8, 16, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU vision dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow requests opencv-python-headless
      - name: Scan r10 sample shard
        run: |
          python experiments/sobel_shape_search/sobel_scan.py \
            --shard ${{ matrix.shard }} \
            --max-items "$MAX_ITEMS" \
            --top-k "$TOP_K" \
            --out "sobel_results_shard_${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sobel-shard-${{ matrix.shard }}
          path: sobel_results_shard_${{ matrix.shard }}.json
          retention-days: 7

  combine:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sobel-shard-*
          path: shards
          merge-multiple: true
      - name: Combine candidate lists
        run: |
          python - <<'PY'
          import glob, json
          rows=[]; summaries=[]
          for fn in glob.glob('shards/sobel_results_shard_*.json'):
              d=json.load(open(fn)); summaries.append(d['summary']); rows.extend(d['results'])
          rows.sort(key=lambda r:r['score'])
          out={'summaries':summaries,'results':rows[:250]}
          open('sobel_pilot_combined.json','w').write(json.dumps(out,indent=2))
          with open('sobel_pilot_summary.md','w') as f:
              f.write('# Sobel manuscript shape-search pilot\n\n')
              f.write(f"Scanned: {sum(s.get('seen',0) for s in summaries)} pages; successful: {sum(s.get('ok',0) for s in summaries)}; errors: {sum(s.get('errors',0) for s in summaries)}.\n\n")
              f.write('| rank | score | manuscript | folio | region |\n|---:|---:|---|---|---|\n')
              for i,r in enumerate(rows[:25],1):
                  region=r.get('region_url') or r.get('search_url') or ''
                  f.write(f"| {i} | {r['score']:.4f} | `{r['manuscript_id']}` | {r.get('folio_label') or r.get('canvas_index')} | {region} |\n")
          PY
          cat sobel_pilot_summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sobel-pilot-combined
          path: |
            sobel_pilot_combined.json
            sobel_pilot_summary.md
          retention-days: 7

  cosine:
    needs: combine
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cosine dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow requests opencv-python-headless torch transformers
      - name: Run HOG, edge, and DINOv3 cosine calibration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python research/cosine_calibration/cosine_pilot.py \
            --classical-top 200 \
            --dino-top 48 \
            --out cosine_pilot.json
          cat cosine_pilot.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sobel-cosine-calibration
          path: |
            cosine_pilot.json
            cosine_pilot.md
          if-no-files-found: warn
          retention-days: 14
