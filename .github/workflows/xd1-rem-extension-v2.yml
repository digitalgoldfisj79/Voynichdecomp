name: XD1 ReM extension v2
on:
  push:
    branches: [supergrammar-xd1-closeout-20260928]
    paths: [".github/workflows/xd1-rem-extension-v2.yml"]
permissions:
  contents: read
jobs:
  rem:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy
      - run: python research/xd1_rem_repetition_20260928.py --preflight
      - run: python research/xd1_rem_repetition_20260928.py --run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xd1-rem-extension-v2
          path: research/xd1_rem_results_20260928/
          if-no-files-found: warn
