name: XD1 recurrence sensitivity fast-check

on:
  push:
    branches:
      - supergrammar-v03-crossdomain-controls-20260920
    paths:
      - .github/workflows/xd1-recurrence-sensitivity-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Run independent vectorized sensitivity
        run: python research/xd1_recurrence_sensitivity_fast_20260920.py
