name: SVT v0.4.1 Clock Drift Diagnostic

on:
  pull_request:
    branches:
      - experiment/svt-hidden-segmentation-v0.4-20260821
    paths:
      - 'experiments/stateful_verbose_transducer_v0_1/diagnose_v041_clock_drift.py'
      - '.github/workflows/svt-v041-clock-diagnostic.yml'

permissions:
  contents: read

jobs:
  trial:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        mode: [periodic, line_reset]
        replicate: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy numba rapidfuzz
      - name: Compile
        run: |
          python -m py_compile \
            experiments/stateful_verbose_transducer_v0_1/diagnose_v041_clock_drift.py
      - name: Run nonbinding clock-drift diagnostic
        run: |
          mkdir -p results
          python experiments/stateful_verbose_transducer_v0_1/diagnose_v041_clock_drift.py \
            --repo . --mode '${{ matrix.mode }}' --replicate '${{ matrix.replicate }}' \
            --output 'results/clock_${{ matrix.mode }}_${{ matrix.replicate }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: svt-v041-clock-${{ matrix.mode }}-${{ matrix.replicate }}
          path: results/*.json
