name: compression-transfer-finnish-fallback

on:
  push:
    paths:
      - 'corpus_acquisition_staging/compression_transfer_v0_1/nlfcl_acquire.py'
      - '.github/workflows/compression-transfer-finnish-fallback.yml'
  pull_request:
    paths:
      - 'corpus_acquisition_staging/compression_transfer_v0_1/nlfcl_acquire.py'
      - '.github/workflows/compression-transfer-finnish-fallback.yml'
  workflow_dispatch:

concurrency:
  group: compression-transfer-finnish-fallback
  cancel-in-progress: true

jobs:
  acquire-nlfcl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile acquisition code
        run: python -m py_compile corpus_acquisition_staging/compression_transfer_v0_1/nlfcl_acquire.py
      - name: Acquire exact Finnish release
        run: >-
          python corpus_acquisition_staging/compression_transfer_v0_1/nlfcl_acquire.py
          --output corpus_acquisition_staging/compression_transfer_v0_1/results/nlfcl_fi
          --year-cutoff 1800
          --target-docs 12
          --min-units 4096
      - name: Validate exact files and manifest
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root = Path('corpus_acquisition_staging/compression_transfer_v0_1/results/nlfcl_fi')
          rows = list(csv.DictReader((root / 'manifest.csv').open(encoding='utf-8', newline='')))
          for row in rows:
              path = root / row['path']
              assert path.is_file(), path
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['sha256'], row['document_id']
          summary = json.loads((root / 'summary.json').read_text())
          assert summary['voynich_accessed'] is False
          assert summary['accepted_documents'] == len(rows)
          print(json.dumps({'rows': len(rows), 'authors': summary['accepted_authors'], 'status': summary['status']}, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compression-transfer-nlfcl-finnish-fallback
          path: corpus_acquisition_staging/compression_transfer_v0_1/results/nlfcl_fi/
          if-no-files-found: error
