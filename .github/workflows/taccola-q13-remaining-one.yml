name: Taccola Q13 remaining witnesses one-by-one

on:
  push:
    branches:
      - gpt56/taccola-q13-calibration-v0.1-repair-20260830
    paths:
      - 'research/taccola_q13/extract_one.py'
      - '.github/workflows/taccola-q13-remaining-one.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: research/taccola_q13

jobs:
  one:
    strategy:
      fail-fast: false
      matrix:
        id: [pal766, pal_lat_1986, bg01, bg07, bg13, bg19, colmar491, ljs419, bg04, bg10, bg16, bg22]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pillow requests opencv-python-headless
      - name: Extract one locked witness
        run: python research/taccola_q13/extract_one.py --id '${{ matrix.id }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taccola-one-${{ matrix.id }}
          path: taccola_one_output/**
          if-no-files-found: warn
          retention-days: 14
