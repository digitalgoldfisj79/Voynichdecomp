name: Export Medieval Magic v0.2 audit sources

on:
  push:
    branches:
      - experiment/medieval-magic-formula-discriminator-v0.2-full-20260815
    paths:
      - '.github/workflows/export-medieval-magic-v02-audit-sources.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4
      - name: Decode exact frozen runner and target data
        shell: bash
        run: |
          mkdir -p audit_sources
          base64 -d experiments/medieval_magic_formula_discriminator_v0_2_full/run_full_v02.py.gz.b64 | gzip -dc > audit_sources/run_full_v02.py
          base64 -d experiments/medieval_magic_formula_discriminator_v0_2_full/voynich_transcriptions_slim.json.gz.b64 | gzip -dc > audit_sources/voynich_transcriptions_slim.json
          cp voynich_section_map.json audit_sources/voynich_section_map.json
          cp experiments/medieval_magic_formula_discriminator_v0_2_full/PROTOCOL_V0_2_FULL.md audit_sources/PROTOCOL_V0_2_FULL.md || true
          cp experiments/medieval_magic_formula_discriminator_v0_2_full/AMENDMENT_001_IMPLEMENTATION_BUGFIX.md audit_sources/AMENDMENT_001_IMPLEMENTATION_BUGFIX.md || true
          sha256sum audit_sources/* | tee audit_sources/SHA256SUMS.txt
      - name: Upload exact audit sources
        uses: actions/upload-artifact@v4
        with:
          name: medieval-magic-v02-audit-sources
          path: audit_sources/
          retention-days: 30
