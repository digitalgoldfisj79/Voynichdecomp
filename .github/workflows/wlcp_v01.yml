name: WLCP v0.1 Word Length Cryptanalysis

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/wlcp-v01-20260829
    paths:
      - experiments/wlcp_v01/**
      - .github/workflows/wlcp_v01.yml

permissions:
  contents: read

jobs:
  wlcp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy

      - name: Acquire frozen ZL3b source
        run: |
          mkdir -p experiments/wlcp_v01/_source
          curl --fail --location --retry 5 --retry-delay 2 \
            https://www.voynich.nu/data/ZL3b-n.txt \
            -o experiments/wlcp_v01/_source/ZL3b-n.txt
          sha256sum experiments/wlcp_v01/_source/ZL3b-n.txt | tee experiments/wlcp_v01/_source/SHA256SUMS.txt
          head -n 4 experiments/wlcp_v01/_source/ZL3b-n.txt

      - name: Run preregistered WLCP v0.1
        run: |
          python experiments/wlcp_v01/run_wlcp_v01.py \
            --source experiments/wlcp_v01/_source/ZL3b-n.txt \
            --out experiments/wlcp_v01/output \
            --reps 500 | tee experiments/wlcp_v01/output_console.txt

      - name: Verify outputs
        run: |
          test -s experiments/wlcp_v01/output/RESULTS.md
          test -s experiments/wlcp_v01/output/results.json
          test -s experiments/wlcp_v01/output/phase0_audit.pkl
          test -s experiments/wlcp_v01/output/phase1_eva.pkl
          test -s experiments/wlcp_v01/output/phase1_char.pkl
          test -s experiments/wlcp_v01/output/phase2_gates.pkl
          cat experiments/wlcp_v01/output/RESULTS.md

      - name: Upload complete WLCP artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wlcp-v01-results
          path: |
            experiments/wlcp_v01/output/
            experiments/wlcp_v01/output_console.txt
            experiments/wlcp_v01/_source/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
