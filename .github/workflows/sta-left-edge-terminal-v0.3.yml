name: STA left-edge terminal v0.3

on:
  push:
    branches:
      - experiment/sta-left-edge-terminal-v0.3-20260815
    paths:
      - 'experiments/sta_left_edge_terminal_v0_3/**'
      - '.github/workflows/sta-left-edge-terminal-v0.3.yml'

permissions:
  contents: write

jobs:
  terminal-left-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install 'numpy<2'
      - name: Compile frozen implementation
        run: python -m py_compile experiments/sta_left_edge_terminal_v0_3/run_terminal.py
      - name: Run target-blind exactness check
        run: python experiments/sta_left_edge_terminal_v0_3/run_terminal.py --build-check
      - name: Resolve terminal full-run gate
        id: gate
        run: |
          if [ -f experiments/sta_left_edge_terminal_v0_3/RUN_FULL ]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Acquire canonical RF1b STA source
        if: steps.gate.outputs.full == 'true'
        run: |
          curl --fail --location --retry 3 --output /tmp/RF1b.txt https://voynich.nu/data/sta/RF1b.txt
          echo '81c331b7d8e76761e27d350c3b37ccfbe192848e6c8a227bcb5d40fb29259b17  /tmp/RF1b.txt' | sha256sum --check --strict
      - name: Run frozen terminal discriminator
        if: steps.gate.outputs.full == 'true'
        run: python experiments/sta_left_edge_terminal_v0_3/run_terminal.py /tmp/RF1b.txt
      - name: Commit deterministic terminal results
        if: steps.gate.outputs.full == 'true'
        run: |
          git config user.name 'voynich-terminal-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add results/sta_left_edge_terminal_v0_3/
          if git diff --cached --quiet; then
            echo 'No result changes.'
          else
            git commit -m 'Add terminal STA left-edge results'
            git push
          fi
      - name: Upload terminal result artifact
        if: steps.gate.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sta-left-edge-terminal-v0.3-results
          path: results/sta_left_edge_terminal_v0_3/
