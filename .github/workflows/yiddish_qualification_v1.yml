name: Yiddish qualification v1 finite-panel R

on:
  push:
    branches:
      - gpt56/yiddish-qualification-v1-20260912
    paths:
      - 'experiments/yiddish_qualification_v1/**'
      - '.github/workflows/yiddish_qualification_v1.yml'
  workflow_dispatch:

jobs:
  run-r-normalized:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run finite-panel R benchmark
        run: python experiments/yiddish_qualification_v1/finite_panel_r_v01.py
      - name: Upload complete audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yiddish-qualification-v1-r-normalized
          path: experiments/yiddish_qualification_v1/run_output/
          if-no-files-found: error
