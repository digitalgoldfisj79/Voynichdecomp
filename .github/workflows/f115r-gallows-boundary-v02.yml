name: f115r gallows boundary v0.2

on:
  push:
    branches:
      - experiment/f115r-local-hand-boundary-v01-20260916
    paths:
      - 'experiments/f115r_gallows_boundary_v02/**'
      - '.github/workflows/f115r-gallows-boundary-v02.yml'

permissions:
  contents: write

jobs:
  gallows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: experiment/f115r-local-hand-boundary-v01-20260916
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install transparent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn opencv-python-headless requests
      - name: Run sealed gallows-only assay
        run: python experiments/f115r_gallows_boundary_v02/run_gallows_v02.py
      - name: Remove source scan
        run: rm -f experiments/f115r_gallows_boundary_v02/results/1006274_f115r.jpg
      - name: Persist text results and ASCII QC
        run: |
          git config user.name 'voynich-assay-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/f115r_gallows_boundary_v02/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit'
          else
            git commit -m 'Record f115r gallows-only v0.2 result'
            git push origin HEAD:experiment/f115r-local-hand-boundary-v01-20260916
          fi
