name: f115r local hand boundary v0.1

on:
  push:
    branches:
      - experiment/f115r-local-hand-boundary-v01-20260916
    paths:
      - 'experiments/f115r_local_hand_boundary_v01/**'
      - '.github/workflows/f115r-local-hand-boundary-v01.yml'

permissions:
  contents: write

jobs:
  assay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4
        with:
          ref: experiment/f115r-local-hand-boundary-v01-20260916
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install transparent image-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn opencv-python-headless requests
      - name: Run blinded same-page assay
        run: python experiments/f115r_local_hand_boundary_v01/run_assay.py
      - name: Remove source scan before persistence
        run: rm -f experiments/f115r_local_hand_boundary_v01/results/1006274_f115r.jpg
      - name: Persist result and QC overlay
        run: |
          git config user.name 'voynich-assay-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/f115r_local_hand_boundary_v01/results
          if git diff --cached --quiet; then
            echo 'No result changes to commit'
          else
            git commit -m 'Record f115r local hand-boundary v0.1 result'
            git push origin HEAD:experiment/f115r-local-hand-boundary-v01-20260916
          fi
