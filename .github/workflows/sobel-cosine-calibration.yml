name: Sobel cosine calibration

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/cosine_calibration/**'
      - '.github/workflows/sobel-cosine-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cosine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cancel duplicate full sweeps
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEEP_RUN_ID: '32341056376'
          FULL_WORKFLOW_ID: '338384960'
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          keep = int(os.environ['KEEP_RUN_ID'])
          workflow = os.environ['FULL_WORKFLOW_ID']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?per_page=100'
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as r:
              runs = json.load(r).get('workflow_runs', [])
          cancelled = []
          for run in runs:
              rid = int(run['id'])
              if rid == keep or run.get('status') not in {'queued','in_progress','waiting','requested','pending'}:
                  continue
              cancel_url = f'https://api.github.com/repos/{repo}/actions/runs/{rid}/cancel'
              creq = urllib.request.Request(cancel_url, data=b'', method='POST', headers=headers)
              try:
                  with urllib.request.urlopen(creq, timeout=30) as r:
                      r.read()
                  cancelled.append(rid)
              except urllib.error.HTTPError as e:
                  print(json.dumps({'event':'cancel_failed','run_id':rid,'http':e.code}), flush=True)
          print(json.dumps({'event':'duplicate_cleanup','kept':keep,'cancelled':cancelled}), flush=True)
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install classical cosine dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow requests opencv-python-headless
      - name: Run HOG and edge cosine calibration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python research/cosine_calibration/cosine_pilot.py \
            --top 200 \
            --out cosine_pilot.json
          cat cosine_pilot.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sobel-cosine-calibration
          path: |
            cosine_pilot.json
            cosine_pilot.md
          if-no-files-found: warn
          retention-days: 14
