name: Yiddish HebrewBooks 42163 acquisition probe v01
on:
  push:
    branches: [gpt56/yiddish-m0-invariants-v01-20260912]
    paths:
      - 'experiments/yiddish_m0_invariants_v01/probe_hebrewbooks_42163.py'
      - '.github/workflows/yiddish_hebrewbooks42163_probe_v01.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Probe source page and discovered download links
        run: python experiments/yiddish_m0_invariants_v01/probe_hebrewbooks_42163.py
      - uses: actions/upload-artifact@v4
        with:
          name: yiddish-hebrewbooks42163-probe-v01
          path: experiments/yiddish_m0_invariants_v01/hebrewbooks42163_probe/
          if-no-files-found: error
