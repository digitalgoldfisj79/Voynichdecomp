name: Yiddish HSJ LAUDATIO probe v01
on:
  push:
    branches: [gpt56/yiddish-m0-invariants-v01-20260912]
    paths:
      - 'experiments/yiddish_m0_invariants_v01/probe_hsj_laudatio.py'
      - '.github/workflows/yiddish_hsj_probe_v01.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe LAUDATIO API and HSJ page
        run: python experiments/yiddish_m0_invariants_v01/probe_hsj_laudatio.py
      - uses: actions/upload-artifact@v4
        with:
          name: yiddish-hsj-laudatio-probe-v01
          path: experiments/yiddish_m0_invariants_v01/hsj_probe_output/
          if-no-files-found: error
