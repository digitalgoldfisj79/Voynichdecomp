name: Yiddish Shmuel1544 anon-word v02 census
on:
  push:
    branches: [gpt56/yiddish-m0-invariants-v01-20260912]
    paths:
      - 'experiments/yiddish_m0_anon_word_v02/acquire_shmuel1544_v02.py'
      - 'experiments/yiddish_m0_anon_word_v02/anon_word_v02.py'
      - '.github/workflows/yiddish_shmuel1544_v02_census.yml'
  workflow_dispatch:
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow numpy opencv-python-headless scikit-image scikit-learn
      - name: Run frozen machine-only census
        run: python experiments/yiddish_m0_anon_word_v02/acquire_shmuel1544_v02.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shmuel1544-anon-v02-census
          path: experiments/yiddish_m0_anon_word_v02/shmuel1544_census/
          if-no-files-found: warn
          compression-level: 6
