name: VMS blind bifolium seriation v01

on:
  push:
    branches:
      - 'gpt56/voynich-topology-v01'
    paths:
      - 'scripts/vms_blind_bifolium_seriation.py'
      - 'protocols/vms_blind_bifolium_seriation_v01.md'
      - '.github/workflows/vms-blind-bifolium-seriation.yml'
  pull_request:
    paths:
      - 'scripts/vms_blind_bifolium_seriation.py'
      - 'protocols/vms_blind_bifolium_seriation_v01.md'
      - '.github/workflows/vms-blind-bifolium-seriation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blind-seriation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy requests
      - name: Run blind bifolium seriation
        run: python scripts/vms_blind_bifolium_seriation.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: vms-blind-bifolium-seriation-v01
          path: artifacts/vms_blind_bifolium_seriation_v01/
          if-no-files-found: error
          retention-days: 30
