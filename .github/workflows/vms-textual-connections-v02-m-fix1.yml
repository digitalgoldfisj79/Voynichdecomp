name: VMS pure-text connections v0.2 Stage M fix1

on:
  push:
    branches: ['gpt56/voynich-topology-v01']
    paths:
      - 'scripts/vms_textual_connections_v02_m_fix1.py'
      - '.github/workflows/vms-textual-connections-v02-m-fix1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  micro-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check numpy requests scipy scikit-learn
      - name: Run unchanged Stage M assay
        run: python scripts/vms_textual_connections_v02_m_fix1.py
      - uses: actions/upload-artifact@v4
        with:
          name: vms-textual-connections-v02-m-fix1
          path: artifacts/vms_textual_connections_v02_m/
          if-no-files-found: error
          retention-days: 30
