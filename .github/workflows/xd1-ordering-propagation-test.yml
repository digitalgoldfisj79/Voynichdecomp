name: XD1 ordering propagation test

on:
  push:
    branches:
      - supergrammar-xd1-closeout-20260928
    paths:
      - ".github/workflows/xd1-ordering-propagation-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python research/test_sequence_ordering_propagation_20260928.py
