name: V5 frequency-matched recurrence

on:
  push:
    branches:
      - programme-v5-frequency-20260923
    paths:
      - research/v5_frequency_matched_20260923.py
      - .github/workflows/v5-frequency-matched-20260923.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V5 frequency-matched test
        run: python research/v5_frequency_matched_20260923.py | tee v5.log
      - uses: actions/upload-artifact@v4
        with:
          name: v5-frequency-matched-20260923
          path: |
            research/RESULTS_v5_frequency_matched_20260923.json
            research/v5_checkpoints/
            v5.log
