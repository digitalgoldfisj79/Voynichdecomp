name: Medieval Magic v0.2 Folio Section Audit

on:
  push:
    branches:
      - experiment/medieval-magic-formula-discriminator-v0.2-full-20260815
    paths:
      - .github/workflows/medieval-magic-v02-folio-section-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Reconstruct frozen external data and exact runner
        shell: bash
        run: |
          set -euo pipefail
          EXP="experiments/medieval_magic_formula_discriminator_v0_2_full"
          mkdir -p "$EXP/data/a_sources"
          cp experiments/medieval_magic_formula_discriminator_v0_1/data/lecouteux_formula_corpus_v02.part00 "$EXP/data/lecouteux_formula_corpus_v02.part00"
          python - <<'PY'
          import json, pathlib
          exp=pathlib.Path('experiments/medieval_magic_formula_discriminator_v0_2_full')
          d=json.loads((exp/'a_sources_bundle.json').read_text(encoding='utf-8'))
          out=exp/'data'/'a_sources'; out.mkdir(parents=True,exist_ok=True)
          for name,text in d.items(): (out/name).write_text(text,encoding='utf-8')
          PY
          cd "$EXP"
          cat data/lecouteux_formula_corpus_v02.part* | tr -d '\n\r' | base64 -d | gzip -d > data/lecouteux_formula_corpus_v02.csv
          base64 -d run_full_v02.py.gz.b64 | gzip -d > run_full_v02.py
          base64 -d audit_folio_section_v02.py.gz.b64 | gzip -d > audit_folio_section_v02.py
          python -m py_compile run_full_v02.py audit_folio_section_v02.py
          sha256sum run_full_v02.py audit_folio_section_v02.py data/lecouteux_formula_corpus_v02.csv
      - name: Run frozen folio and section audit
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/medieval_magic_formula_discriminator_v0_2_full
          PYTHONUNBUFFERED=1 python audit_folio_section_v02.py 2>&1 | tee folio_section_audit_v02.log
      - name: Print audit summary
        if: always()
        shell: bash
        run: |
          EXP="experiments/medieval_magic_formula_discriminator_v0_2_full"
          cat "$EXP/results_folio_section_audit_v02/folio_section_audit.json" 2>/dev/null || true
      - name: Upload folio section audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medieval-magic-v02-folio-section-audit
          if-no-files-found: warn
          retention-days: 30
          path: |
            experiments/medieval_magic_formula_discriminator_v0_2_full/results_folio_section_audit_v02/
            experiments/medieval_magic_formula_discriminator_v0_2_full/folio_section_audit_v02.log
            experiments/medieval_magic_formula_discriminator_v0_2_full/AMENDMENT_002_FOLIO_SECTION_POSTHOC_AUDIT.md
