' | base64 -d > run_phase2_shard_fast.py
          echo '9913f34f5ee11564f017923ea73f3f005cb6097a507b18010a07598c1dce00ab  permutation_operators.py' | sha256sum -c -
          echo 'cbd47a8b8507e617fa1902ac3665d17714bde1926539cb590ff5f7d7a1c0f507  phase2_operators.py' | sha256sum -c -
          echo 'c9e61e11469f5472ed6a5aae32a77fedd1bb2cf4c56ccec05d2ce7902b33e0b9  run_phase2_shard_fast.py' | sha256sum -c -
          printf '%s\n' 'Phase-2 preregistered freeze: d0b1f1558e745b73fc158cf68b5f447c3aba68857c1a6e7657fb2405786a14ef' > PHASE2_FREEZE_REF.txt
      - name: Run frozen Phase2 shard
        working-directory: /tmp/p2
        run: python run_phase2_shard_fast.py ${{ matrix.shard }} 10 | tee phase2.log
      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: asc-permutation-phase2-${{ matrix.shard }}
          path: |
            /tmp/p2/results/P2_SHARD_*_OF_10.json
            /tmp/p2/phase2.log
            /tmp/p2/PHASE2_FREEZE_REF.txt
          retention-days: 7
