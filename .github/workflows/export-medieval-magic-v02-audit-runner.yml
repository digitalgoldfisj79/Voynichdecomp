name: Export Medieval Magic v0.2 audit runner

on:
  push:
    branches:
      - experiment/medieval-magic-formula-discriminator-v0.2-full-20260815
    paths:
      - '.github/workflows/export-medieval-magic-v02-audit-runner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          EXP=experiments/medieval_magic_formula_discriminator_v0_2_full
          mkdir -p audit_runner_export
          base64 -d "$EXP/audit_folio_section_v02.py.gz.b64" | gzip -d > audit_runner_export/audit_folio_section_v02.py
          base64 -d "$EXP/run_full_v02.py.gz.b64" | gzip -d > audit_runner_export/run_full_v02.py
          cp voynich_section_map.json audit_runner_export/
          sha256sum audit_runner_export/* > audit_runner_export/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: medieval-magic-v02-audit-runner-export
          path: audit_runner_export/
          retention-days: 30
