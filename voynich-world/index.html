<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voynich World v2 (with cut-outs)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; }
  /* The picture always fills the window; in recording mode it keeps its proportions (black bars). */
  #view { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; display: block; cursor: crosshair; }

  #hud { position: fixed; left: 14px; bottom: 12px; color: #fff6dc; background: rgba(40,28,16,.55); padding: 4px 10px; border-radius: 3px; font-size: 13px; pointer-events: none; }
  #click-hint { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); color: #fff6dc; background: rgba(40,28,16,.65); padding: 8px 16px; border-radius: 3px; font-size: 14px; pointer-events: none; text-align: center; line-height: 1.5; }
  #keys { position: fixed; left: 14px; top: 12px; color: #fff6dc; background: rgba(40,28,16,.55); padding: 8px 12px; border-radius: 3px; font-size: 12.5px; line-height: 1.55; pointer-events: none; }
  #keys b { color: #f0cc62; font-weight: normal; }
  body.locked #click-hint { display: none; }

  #panel { position: fixed; right: 12px; top: 12px; width: 290px; max-height: calc(100vh - 24px); overflow: auto; background: rgba(238,226,192,.94); color: #3a2a1c; border: 1px solid #8a7550; border-radius: 4px; font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  body.locked #panel { opacity: .35; pointer-events: none; }
  .panel-head { display: flex; justify-content: space-between; padding: 8px 12px; cursor: pointer; font-weight: bold; background: rgba(138,117,80,.25); user-select: none; }
  #panel.collapsed .panel-body { display: none; }
  .panel-body { padding: 4px 10px 10px; }
  details { border-bottom: 1px solid rgba(138,117,80,.35); padding: 4px 0; }
  summary { cursor: pointer; padding: 4px 0; font-variant: small-caps; letter-spacing: .04em; }
  .row { display: grid; grid-template-columns: 1fr 1fr 44px; gap: 6px; align-items: center; padding: 3px 0; }
  .row .name { font-size: 12px; }
  .row input[type=range] { width: 100%; }
  .row input[type=number], .row select { width: 100%; box-sizing: border-box; font: inherit; }
  .row input[type=color] { width: 100%; height: 22px; padding: 0; border: 1px solid #8a7550; background: none; }
  .row .val { font-size: 11px; text-align: right; opacity: .75; }
  .row.btn { display: block; } .row.btn button { width: 100%; font: inherit; padding: 4px; cursor: pointer; background: #e2d2a4; border: 1px solid #8a7550; border-radius: 3px; color: #3a2a1c; }
  .row.btn button:hover { background: #ead9ac; }
  .tip { font-size: 11.5px; opacity: .8; margin: 8px 0 0; }

  /* H hides every bit of interface for clean recording */
  body.ui-hidden #hud, body.ui-hidden #panel, body.ui-hidden #click-hint, body.ui-hidden #keys { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="click-hint">Click the picture to look around &middot; Esc frees the mouse</div>
<div id="keys">
  <b>W A S D</b> / arrows walk &nbsp; <b>Shift</b> run<br>
  <b>F</b> fly (<b>Space</b>/<b>C</b> up/down) &nbsp; <b>P</b> autopilot<br>
  <b>H</b> hide all UI &nbsp; <b>R</b> fixed recording size<br>
  <b>N</b> new seed &nbsp; <b>B</b> head-bob on/off
</div>
<div id="hud"></div>
<div id="panel"></div>

<!-- Plain script files, loaded in this order. No server needed. -->
<script src="vendor/three.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/settings.js"></script>
<script src="js/terrain.js"></script>
<script src="js/placeholders.js"></script>
<!-- Stage 2: the Voynich cut-outs, stored inside .js files so double-clicking still works (see tools/pack_images.py) -->
<script src="images/plants.js"></script>
<script src="images/nymphs.js"></script>
<script src="images/animals.js"></script>
<script src="js/images.js"></script>
<script src="js/plants.js"></script>
<script src="js/groundfog.js"></script>
<script src="js/nymphs.js"></script>
<script src="js/sky.js"></script>
<script src="js/player.js"></script>
<script src="js/panel.js"></script>
<script src="js/main.js"></script>
</body>
</html>
